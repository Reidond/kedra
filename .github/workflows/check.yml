name: Check workspace

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # The x86_64 leg keeps the plain "rust" name required by main's branch protection.
    name: ${{ matrix.architecture == 'x86_64' && 'rust' || format('rust-{0}', matrix.architecture) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout pinned source and skills
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.19
          enable-cache: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Report toolchain
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCHITECTURE"
          rustc --version --verbose
          cargo --version
          git --version
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Python lint
        # Same pin as mise.toml; ruff.toml holds the configuration.
        run: uvx ruff@0.16.9 check --no-cache
      - name: Complexity
        # Same pin as mise.toml; cccc.toml holds the limits. The release archive
        # is verified against its published SHA-256 before use. --min 41 only
        # narrows the table to the functions over the limit of 40.
        env:
          CCCC_VERSION: 1.7.0
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          case "$EXPECTED_ARCHITECTURE" in
            x86_64) digest=75d2fb5486238eeb40a80fec2de8fe5075e6ce567b6741a56fa511ed2082e45a ;;
            aarch64) digest=f775a19ebd58fc7a4cd64769b8d442425d8afde66207386db04eb87747ed75b8 ;;
            *) echo "no pinned cccc archive for $EXPECTED_ARCHITECTURE" >&2; exit 1 ;;
          esac
          archive="cccc-v${CCCC_VERSION}-${EXPECTED_ARCHITECTURE}-unknown-linux-musl.tar.gz"
          tools="$RUNNER_TEMP/cccc"
          mkdir -p "$tools"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$tools/$archive" \
            "https://github.com/moznion/cccc/releases/download/v${CCCC_VERSION}/$archive"
          echo "$digest  $tools/$archive" | sha256sum --check --strict
          tar -xzf "$tools/$archive" -C "$tools" cccc
          "$tools/cccc" --version
          "$tools/cccc" --table --min 41 .
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: End-to-end CLI workflows
        run: cargo test --workspace --test 'e2e_*' --locked
      - name: Release build
        run: cargo build --workspace --release --locked
      - name: Independent OpenSSL signature interoperability
        run: uv run usr/src/kedra/tests/cli/release-interop.py --sysroot target/release/sysroot --workdir target/release-interop
      - name: Verify signed resolved-input CLI workflows
        run: uv run usr/src/kedra/tests/cli/release-material.py --workdir target/release-material
      - name: Record the checked Linux CLI checksum
        working-directory: target/release
        run: sha256sum sysroot > sysroot.sha256
      - name: Retain checked CLI for manual disposable-guest workflows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sysroot-linux-${{ matrix.architecture }}-${{ github.sha }}
          path: |
            target/release/sysroot
            target/release/sysroot.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Scope of this result
        if: always()
        run: |
          echo 'This workflow builds and lints Rust, then exercises the actual CLI export workflow and independent signature interoperability.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Installed-system behavior is covered by the separate disposable VM workflows. Unit and repository self-tests are not used.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The retained CLI is a development verification artifact tied to this exact source/run, not an owner-signed OS release or installer.' >> "$GITHUB_STEP_SUMMARY"
