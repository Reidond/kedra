name: Publish installer ISO

# Owner-dispatched only: a full new installer release. The ISO installs the
# target's current signed `stable` image, which already carries every update
# release.yml has published, and is attached to a new GitHub Release. Installed
# systems keep updating from GHCR through `sysroot update`; this workflow never
# builds, signs or moves an OS image and holds no signing secret.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Kedra target whose stable image the ISO installs
        type: choice
        options: [desktop, qemu-arm64]
        default: desktop

permissions:
  contents: read

concurrency:
  group: iso-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  iso:
    if: github.repository == 'Reidond/kedra' && github.ref == 'refs/heads/main'
    # The pinned image-builder only builds media for its own architecture.
    runs-on: ${{ inputs.target == 'qemu-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      KEDRA_TARGET: ${{ inputs.target }}
      GH_REPO: ${{ github.repository }}
      MEDIA: ${{ github.workspace }}/output/iso
    steps:
      - name: Install media build tools and free runner disk
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman netavark skopeo openssl
          # The payload, Anaconda environment and ISO need tens of GB.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.19
          enable-cache: false
      - name: Select the current signed stable image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository=$(jq -er --arg target "$KEDRA_TARGET" '.targets[$target].repository' usr/src/kedra/image/release/targets.json)
          digest="sha256:$(skopeo inspect --raw "docker://$repository:stable" | sha256sum | cut -d ' ' -f 1)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          tag="$KEDRA_TARGET-${digest:7:16}"
          # One release per signed image; published media is never replaced.
          if gh release view "$tag" --json tagName > /dev/null 2> "$RUNNER_TEMP/release-lookup.log"; then
            echo "Release $tag already exists for $repository@$digest"; exit 1
          fi
          grep -q 'release not found' "$RUNNER_TEMP/release-lookup.log"
          printf 'image=%s@%s\ntag=%s\n' "$repository" "$digest" "$tag" >> "$GITHUB_OUTPUT"
      - name: Build the ISO from the verified signed image
        # build-local.py checks the fixed public key, the strict signature and
        # repository policy and the image's target scope before building.
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          mkdir -p "$(dirname "$MEDIA")"
          uv run usr/src/kedra/installer/build-local.py --image "$IMAGE" --output-dir "$MEDIA"
      - name: Split the ISO into release-sized parts
        working-directory: ${{ env.MEDIA }}
        run: |
          set -euo pipefail
          # The disposable runner no longer needs the payload and builder images.
          sudo podman rmi --all --force > /dev/null
          iso=$(jq -er .installer.filename installer.json)
          # Each GitHub release asset must be smaller than 2 GiB.
          split --bytes=2000M --numeric-suffixes=1 --suffix-length=2 "$iso" "$iso.part-"
          test "$(cat "$iso".part-* | sha256sum | cut -d ' ' -f 1)" = "$(jq -er .installer.sha256 installer.json)"
          # SHA256SUMS keeps build-local.py's single ISO line, which
          # installer/macos/media.py verify requires of the rejoined ISO.
          sha256sum "$iso".part-* > PARTS.SHA256SUMS
          rm -- "$iso"
      - name: Publish the installer release
        working-directory: ${{ env.MEDIA }}
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.image }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          iso=$(jq -er .installer.filename installer.json)
          source_revision=$(jq -er .source_revision installer.json)
          fingerprint=$(jq -er .public_key_fingerprint installer.json)
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Fresh-installation media for the Kedra \`$KEDRA_TARGET\` target. It installs \`$IMAGE\`,
          the signed \`stable\` image when this release was made, so it includes every earlier update.
          Installed systems keep updating with \`sysroot update\`; they do not need this ISO.

          - Image source revision: $source_revision
          - Installer tooling revision: $GITHUB_SHA
          - Release public key SPKI SHA-256: \`$fingerprint\`

          Download every file of this release into one directory, then:

          \`\`\`sh
          sha256sum --check PARTS.SHA256SUMS
          cat $iso.part-* > $iso
          sha256sum --check SHA256SUMS
          \`\`\`

          The checksums detect damaged downloads; they are not signatures. Before installing, the
          ISO verifies its embedded OS image offline against the target's release key and refuses
          to start without UEFI Secure Boot. See usr/src/kedra/docs/INSTALL.md.
          NOTES
          # The published record is uploaded; build-local.py wrote it before upload.
          jq '.uploaded = true' installer.json > "$RUNNER_TEMP/installer.json"
          mv -- "$RUNNER_TEMP/installer.json" installer.json
          gh release create "$TAG" --target "$source_revision" --title "Kedra installer $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" installer.json SHA256SUMS PARTS.SHA256SUMS "$iso".part-*
          {
            echo "Published installer release $TAG for $IMAGE."
            echo 'The ISO was built from the signed stable image; no installation or boot ran in this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
