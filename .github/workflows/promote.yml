name: Promote qualified desktop installer

on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful current-main release.yml run ID
        required: true
        type: string
      candidate_attempt:
        description: Exact successful run attempt
        required: true
        default: '1'
        type: string
      reviewed_candidate_sha256:
        description: Independently reviewed candidate.json SHA-256
        required: true
        type: string
      qualification_json:
        description: Exact-media manual/E2E qualification JSON with public evidence
        required: true
        type: string
      bootstrap:
        description: First release only; requires an actually absent desktop channel
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-desktop-44-x86_64
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Reidond/kedra' && github.ref == 'refs/heads/main' && vars.KEDRA_RELEASES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      release: ${{ steps.prepare.outputs.release }}
      checkpoint: ${{ steps.prepare.outputs.checkpoint }}
      request: ${{ steps.prepare.outputs.signing_request }}
      candidate: ${{ steps.prepare.outputs.candidate }}
      checksums: ${{ steps.prepare.outputs.checksums }}
    steps:
      - name: Require existing owner-reviewed signing protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Reidond/kedra/environments/kedra-desktop-signing > "$RUNNER_TEMP/signing-environment.json"
          jq -e '.can_admins_bypass == false and .deployment_branch_policy.custom_branch_policies == true and
            any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length) == 1 and
              .reviewers[0].type == "User" and (.reviewers[0].reviewer.login | ascii_downcase) == "reidond")' "$RUNNER_TEMP/signing-environment.json" >/dev/null
          gh api repos/Reidond/kedra/environments/kedra-desktop-signing/deployment-branch-policies > "$RUNNER_TEMP/signing-branches.json"
          jq -e '.total_count == 1 and .branch_policies[0].name == "main" and .branch_policies[0].type == "branch"' "$RUNNER_TEMP/signing-branches.json" >/dev/null
          test "$(gh api repos/Reidond/kedra/branches/main --jq .protected)" = true
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run }}
          name: desktop-installer-candidate-${{ inputs.candidate_run }}-${{ inputs.candidate_attempt }}
          path: output/candidate
      - name: Build public verifier
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          cargo build --workspace --release --locked
      - name: Verify exact media, qualification, authority and channel ordering
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
          REVIEWED_CANDIDATE_SHA256: ${{ inputs.reviewed_candidate_sha256 }}
          QUALIFICATION_JSON: ${{ inputs.qualification_json }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: python3 build/release/promotion.py prepare --candidate-dir output/candidate --work output/promotion --sysroot target/release/sysroot
      - name: Preserve proposed exact public signing inputs for owner review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-promotion-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/promotion/unsigned/
            output/promotion/qualification.json
          if-no-files-found: error
          retention-days: 90

  sign-metadata:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: kedra-desktop-signing
    permissions:
      contents: read
      actions: read
    outputs:
      release_signature: ${{ steps.sign.outputs.release_signature }}
      checkpoint_signature: ${{ steps.sign.outputs.checkpoint_signature }}
      checksums_signature: ${{ steps.sign.outputs.checksums_signature }}
    steps:
      # No checkout, artifact execution, repository script or candidate binary.
      - name: Prepare pinned native signer before exposing private material
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 180 \
            https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64 -o "$RUNNER_TEMP/cosign"
          printf '4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  %s\n' "$RUNNER_TEMP/cosign" | sha256sum --check
          chmod 755 "$RUNNER_TEMP/cosign"
          "$RUNNER_TEMP/cosign" version
      - name: Independently bind reviewed public bytes and unchanged channel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_B64: ${{ needs.prepare.outputs.release }}
          CHECKPOINT_B64: ${{ needs.prepare.outputs.checkpoint }}
          REQUEST_B64: ${{ needs.prepare.outputs.request }}
          CANDIDATE_B64: ${{ needs.prepare.outputs.candidate }}
          CHECKSUMS_B64: ${{ needs.prepare.outputs.checksums }}
          REVIEWED_CANDIDATE_SHA256: ${{ inputs.reviewed_candidate_sha256 }}
          QUALIFICATION_JSON: ${{ inputs.qualification_json }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
          APPROVED_FINGERPRINT: ${{ vars.KEDRA_DESKTOP_KEY_SHA256 }}
          RELEASE_PUBLIC_KEY: ${{ vars.KEDRA_DESKTOP_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Reidond/kedra/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess, time
          def require(value, message):
              if not value:
                  raise SystemExit(message)
          def sha(value):
              return hashlib.sha256(value).hexdigest()
          def unique(pairs):
              value = {}
              for key, item in pairs:
                  require(key not in value, 'Duplicate JSON member')
                  value[key] = item
              return value
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'public-signing'
          root.mkdir(exist_ok=False)
          raw = {}
          for name, variable in [('release', 'RELEASE_B64'), ('checkpoint', 'CHECKPOINT_B64'), ('request', 'REQUEST_B64'),
                                 ('candidate', 'CANDIDATE_B64'), ('checksums', 'CHECKSUMS_B64')]:
              raw[name] = base64.b64decode(os.environ[variable], validate=True)
              require(0 < len(raw[name]) <= 65536, 'Public signing input exceeds its bound')
              (root / ('SHA256SUMS' if name == 'checksums' else name + '.json')).write_bytes(raw[name])
          release, checkpoint, request = [json.loads(raw[name], object_pairs_hook=unique) for name in ['release', 'checkpoint', 'request']]
          candidate = json.loads(raw['candidate'], object_pairs_hook=unique)
          require(request['release_sha256'] == sha(raw['release']) and request['checkpoint_sha256'] == sha(raw['checkpoint'])
                  and request['sha256sums_sha256'] == sha(raw['checksums']), 'Payload hash differs')
          require(request['candidate_sha256'] == os.environ['REVIEWED_CANDIDATE_SHA256']
                  and request['candidate_sha256'] == sha(raw['candidate'])
                  and request['qualification_sha256'] == sha(os.environ['QUALIFICATION_JSON'].encode())
                  and request['key_fingerprint_sha256'] == os.environ['APPROVED_FINGERPRINT'], 'Reviewed authority/evidence differs')
          scope = {'target': 'desktop', 'architecture': 'x86_64', 'fedora_release': 44, 'repository': 'ghcr.io/reidond/kedra-desktop'}
          require(release['scope'] == checkpoint['scope'] == scope and release['project'] == checkpoint['project'] == 'Kedra'
                  and release['schema_version'] == checkpoint['schema_version'] == 1 and release['approval'] == 'promoted'
                  and release['minimum_protocol'] == 1 and release['source_revision'] == request['source_revision'] == os.environ['GITHUB_SHA'], 'Signing scope/source differs')
          build = {'repository': 'Reidond/kedra', 'workflow': '.github/workflows/release.yml',
                   'run_id': int(os.environ['CANDIDATE_RUN']), 'run_attempt': int(os.environ['CANDIDATE_ATTEMPT'])}
          require(release['build'] == request['build'] == build, 'Build identity differs')
          require(type(candidate['schema_version']) is int and candidate['schema_version'] == 2
                  and candidate['approval'] == 'candidate' and candidate['fresh_install_qualified'] is False
                  and all(candidate[key] == release[key] for key in ['project', 'scope', 'source_revision',
                          'build', 'image_digest', 'home_manifest_sha256', 'installer'])
                  and candidate['last_successful_resolution'] == checkpoint['last_successful_resolution'],
                  'Reviewed candidate differs from proposed signed release')
          installer = release['installer']
          iso_name = f'kedra-desktop-44-{build["run_id"]}-{build["run_attempt"]}.iso'
          size = installer['size_bytes']
          require(installer['filename'] == iso_name and type(size) is int and 0 < size <= 64 * 1024**3,
                  'Unexpected installer name or size')
          part_names = [iso_name + f'.part{index:02d}' for index in range((size + 1900 * 1024**2 - 1) // (1900 * 1024**2))]
          require(candidate['parts'] == part_names, 'Unexpected ordered installer parts')
          require(isinstance(candidate['parts_sha256'], dict) and set(candidate['parts_sha256']) == set(part_names),
                  'Missing reviewed download part hashes')
          public_key = (os.environ['RELEASE_PUBLIC_KEY'].strip() + '\n').encode()
          known = {'release.json': raw['release'], 'checkpoint.json': raw['checkpoint'],
                   'candidate.json': raw['candidate'], 'qualification.json': os.environ['QUALIFICATION_JSON'].encode(),
                   'release.pub': public_key, 'release-key.sha256': (os.environ['APPROVED_FINGERPRINT'] + '\n').encode()}
          expected_hashes = {name: sha(value) for name, value in known.items()}
          expected_hashes.update({'source.json': candidate['home_manifest_sha256'],
                                 'packages.txt': candidate['packages_sha256'], 'provenance.json': candidate['provenance_sha256'],
                                 iso_name: installer['sha256']})
          expected_hashes.update(candidate['parts_sha256'])
          assets = request['assets']
          require(isinstance(assets, dict) and set(assets) == set(expected_hashes),
                  'Checksum names differ from fixed candidate assets')
          for name, item in assets.items():
              require(isinstance(item, dict) and set(item) == {'sha256', 'size_bytes'}
                      and isinstance(item['sha256'], str) and re.fullmatch('[a-f0-9]{64}', item['sha256'])
                      and type(item['size_bytes']) is int and 0 < item['size_bytes'] <= 64 * 1024**3,
                      'Invalid reviewed asset identity')
              if name in expected_hashes:
                  require(item['sha256'] == expected_hashes[name], 'Checksum differs from reviewed candidate/payload')
              if name in known:
                  require(item['size_bytes'] == len(known[name]), 'Public payload size differs')
          require(assets[iso_name]['size_bytes'] == size and assets['source.json']['size_bytes'] <= 1048576
                  and assets['packages.txt']['size_bytes'] <= 4 * 1024**2 and assets['provenance.json']['size_bytes'] <= 65536,
                  'Inventory/provenance size exceeds its bound')
          for index, name in enumerate(part_names):
              require(assets[name]['size_bytes'] == min(1900 * 1024**2, size - index * 1900 * 1024**2),
                      'Unexpected download part size')
          expected_checksums = ''.join(f'{assets[name]["sha256"]}  {name}\n' for name in sorted(assets)).encode('ascii')
          require(raw['checksums'] == expected_checksums, 'Checksum payload differs from exact fixed inventory')
          result = subprocess.run(['gh', 'api', f'repos/Reidond/kedra/actions/runs/{build["run_id"]}/attempts/{build["run_attempt"]}'], check=True, capture_output=True)
          run = json.loads(result.stdout)
          require(run['conclusion'] == 'success' and run['head_sha'] == os.environ['GITHUB_SHA']
                  and run['head_branch'] == 'main' and run['event'] == 'workflow_dispatch'
                  and run['path'] == build['workflow'], 'Successful accepted build differs')
          now = int(time.time())
          require(checkpoint['release_sha256'] == sha(raw['release']) and release['sequence'] == request['sequence']
                  and checkpoint['generation'] == request['generation'] and 0 <= now - checkpoint['issued_at'] <= 3600
                  and checkpoint['expires_at'] == checkpoint['issued_at'] + 7 * 86400
                  and 0 <= now - checkpoint['last_successful_resolution'] <= 36 * 3600, 'Signing request is stale or inconsistent')
          result = subprocess.run(['gh', 'api', 'repos/Reidond/kedra/releases/tags/desktop-44-x86_64-channel'], capture_output=True)
          current = json.loads(result.stdout)
          if result.returncode:
              require(current.get('status') == '404' and request['expected_previous_bundle_sha256'] is None
                      and request['expected_previous_release_sha256'] is None and request['expected_previous_checkpoint_sha256'] is None
                      and request['sequence'] == request['generation'] == 1, 'Channel is unavailable or bootstrap is inconsistent')
          else:
              assets = [a for a in current['assets'] if a['name'] == 'channel.json']
              require(not current['draft'] and len(assets) == 1 and 0 < assets[0]['size'] <= 300000, 'Invalid current channel')
              subprocess.run(['gh', 'release', 'download', 'desktop-44-x86_64-channel', '--repo', 'Reidond/kedra',
                              '--pattern', 'channel.json', '--dir', str(root)], check=True)
              with (root / 'channel.json').open('rb') as stream:
                  channel = stream.read(300001)
              require(len(channel) <= 300000 and sha(channel) == request['expected_previous_bundle_sha256'], 'Channel changed after preparation')
              old = json.loads(channel, object_pairs_hook=unique)
              require(sha(old['release']['payload'].encode()) == request['expected_previous_release_sha256']
                      and sha(old['checkpoint']['payload'].encode()) == request['expected_previous_checkpoint_sha256'], 'Previous signed payload hashes differ')
          (root / 'release.pub').write_bytes(public_key)
          PY
          openssl pkey -pubin -in "$RUNNER_TEMP/public-signing/release.pub" -outform DER -out "$RUNNER_TEMP/public-signing/public.der"
          test "$(sha256sum "$RUNNER_TEMP/public-signing/public.der" | cut -d ' ' -f 1)" = "$APPROVED_FINGERPRINT"
      - name: Sign exact release, checkpoint and checksum bytes with dedicated authority
        id: sign
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.KEDRA_DESKTOP_SIGNING_KEY }}
          COSIGN_PASSWORD: ${{ secrets.KEDRA_DESKTOP_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_PRIVATE_KEY" && test -n "$COSIGN_PASSWORD"
          umask 077
          private=$(mktemp -d "$RUNNER_TEMP/kedra-metadata-key.XXXXXXXX")
          trap 'rm -rf -- "$private"' EXIT
          printf '%s\n' "$RELEASE_PRIVATE_KEY" > "$private/release.key"
          unset RELEASE_PRIVATE_KEY
          for name in release checkpoint checksums; do
            payload="$RUNNER_TEMP/public-signing/$name.json"
            if test "$name" = checksums; then payload="$RUNNER_TEMP/public-signing/SHA256SUMS"; fi
            "$RUNNER_TEMP/cosign" sign-blob --yes --use-signing-config=false --tlog-upload=false \
              --key "$private/release.key" --bundle "$private/$name.bundle.json" \
              "$payload"
            jq -er '.messageSignature.signature' "$private/$name.bundle.json" > "$private/$name.sig"
            base64 --decode "$private/$name.sig" > "$private/$name.der"
            openssl dgst -sha256 -verify "$RUNNER_TEMP/public-signing/release.pub" \
              -signature "$private/$name.der" "$payload"
            printf '%s_signature=%s\n' "$name" "$(base64 -w 0 "$private/$name.sig")" >> "$GITHUB_OUTPUT"
          done
          unset COSIGN_PASSWORD

  publish:
    needs: [prepare, sign-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run }}
          name: desktop-installer-candidate-${{ inputs.candidate_run }}-${{ inputs.candidate_attempt }}
          path: output/candidate
      - name: Build public verifier
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          cargo build --workspace --release --locked
      - name: Verify signatures and media again, publish versioned assets, then channel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_B64: ${{ needs.prepare.outputs.release }}
          CHECKPOINT_B64: ${{ needs.prepare.outputs.checkpoint }}
          REQUEST_B64: ${{ needs.prepare.outputs.request }}
          CHECKSUMS_B64: ${{ needs.prepare.outputs.checksums }}
          RELEASE_SIG_B64: ${{ needs.sign-metadata.outputs.release_signature }}
          CHECKPOINT_SIG_B64: ${{ needs.sign-metadata.outputs.checkpoint_signature }}
          CHECKSUMS_SIG_B64: ${{ needs.sign-metadata.outputs.checksums_signature }}
          QUALIFICATION_JSON: ${{ inputs.qualification_json }}
        run: python3 build/release/promotion.py publish --candidate-dir output/candidate --work output/publication --sysroot target/release/sysroot
      - name: Preserve exact public publication records, including interrupted runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/publication/signed/
          if-no-files-found: warn
          retention-days: 90
