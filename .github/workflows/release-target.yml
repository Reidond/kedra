name: Build one signed bootc target

# Called only by release.yml. The github context, run number and concurrency
# belong to that caller, so image identities keep its workflow path and rank.
on:
  workflow_call:
    inputs:
      target:
        description: Closed Kedra release target, a key of usr/src/kedra/image/release/targets.json
        type: string
        required: true
      runner:
        description: That target's native GitHub-hosted runner label from targets.json
        type: string
        required: true

permissions:
  contents: read

jobs:
  # Content-affecting logic lives in reviewed recipe scripts that material.py hashes
  # into the resolved inputs (refresh.py, build.sh, compose.py, build-packages.sh,
  # prepare-trust.py, trust.py and the Containerfiles). This file only orchestrates
  # them, so it is not a recipe: an edit here rebuilds and re-signs nothing. Keep
  # every step that changes image inputs or the build in those scripts.
  build:
    if: github.repository == 'Reidond/kedra' && github.ref == 'refs/heads/main' && vars.KEDRA_RELEASES_ENABLED == 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      KEDRA_TARGET: ${{ inputs.target }}
      KEDRA_RUNNER: ${{ inputs.runner }}
    outputs:
      changed: ${{ steps.preflight.outputs.changed }}
      digest: ${{ steps.publish.outputs.digest }}
      fingerprint: ${{ steps.preflight.outputs.fingerprint }}
      identity_sha256: ${{ steps.inspect.outputs.identity_sha256 }}
      cache: ${{ steps.target.outputs.cache }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a closed native target and main-only unattended signing environment
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          spec=$(jq -ce --arg target "$KEDRA_TARGET" 'if .schema_version == 1 and (.targets | has($target))
            then .targets[$target] else error("Unsupported release target") end' usr/src/kedra/image/release/targets.json)
          test "$(jq -er .runner <<< "$spec")" = "$KEDRA_RUNNER"
          test "$(jq -er .architecture <<< "$spec")" = "$(uname -m)"
          environment=$(jq -er .environment <<< "$spec")
          # The environment the signer job declares (sign-image below).
          test "$environment" = "kedra-$KEDRA_TARGET-signing"
          gh api "repos/Reidond/kedra/environments/$environment" > "$RUNNER_TEMP/signing-environment.json"
          jq -e '.can_admins_bypass == false and .deployment_branch_policy.custom_branch_policies == true and
            all(.protection_rules[]; .type == "branch_policy")' "$RUNNER_TEMP/signing-environment.json" >/dev/null
          gh api "repos/Reidond/kedra/environments/$environment/deployment-branch-policies" > "$RUNNER_TEMP/signing-branches.json"
          jq -e '.total_count == 1 and .branch_policies[0].name == "main" and .branch_policies[0].type == "branch"' "$RUNNER_TEMP/signing-branches.json" >/dev/null
          test "$(gh api repos/Reidond/kedra/branches/main --jq .protected)" = true
          printf 'cache=%s\n' "$(jq -er .cache <<< "$spec")" >> "$GITHUB_OUTPUT"
      # Every Docker-using release job selects the containerd image store before its
      # first Docker operation, so CI behaves as local OrbStack does.
      - name: Select the containerd Docker image store
        timeout-minutes: 2
        run: usr/src/kedra/image/release/runner-containerd.sh
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.19
          enable-cache: false
      # Source checks run locally before a change is signed off (AGENTS.md);
      # this step only builds the binaries the image needs. The exact
      # candidate is still validated in its own job before signing.
      - name: Build source tooling and install image tools
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          cargo build --workspace --release --locked
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman skopeo openssl bubblewrap
      # The run's only Fedora package resolution: every later build installs
      # offline from this RPM lock's fixed-output store objects. Preflight stages
      # the binaries, source plan, pin envelope and build context, compares with
      # the signature-verified stable image and checks exact main once at its end.
      - name: Resolve the RPM lock and compare strictly verified stable image
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output/image-evidence
          uv run usr/src/kedra/image/release/refresh.py prepare --target "$KEDRA_TARGET" --work output/image-evidence \
            --store "$RUNNER_TEMP/kedra-release-store"
      - name: Keep Ubuntu host AppArmor policy off the build sandbox and candidate
        if: steps.preflight.outputs.changed == 'true'
        run: usr/src/kedra/image/release/runner-apparmor.sh output/image-evidence/catalog-installed
      - name: Build changed image with signed-config identity
        if: steps.preflight.outputs.changed == 'true'
        run: usr/src/kedra/image/release/build.sh "$KEDRA_TARGET" "$GITHUB_SHA" "$RUNNER_TEMP"
      - name: Run installed catalog case on the exact composed native image
        if: steps.preflight.outputs.changed == 'true'
        run: |
          set -euo pipefail
          native_root="$RUNNER_TEMP/kedra-release-native"
          # This is the composer cache root, not a new lab adaptation/cache.
          export KEDRA_LAB_ARTIFACTS="$RUNNER_TEMP/kedra-release-store.release-lab"
          evidence=output/image-evidence/catalog-installed
          mkdir -p "$evidence"
          test -d "$KEDRA_LAB_ARTIFACTS/derive"
          test ! -e "$KEDRA_LAB_ARTIFACTS/runs"
          jq -e --slurpfile selected "$native_root/candidate.json" '. == $selected[0]' \
            output/image-evidence/native-candidate.json > /dev/null
          composition=$(jq -er .composition_identity "$native_root/candidate.json")
          derivation=$(jq -er .native_identity "$native_root/candidate.json")
          expected_image=$(jq -er .native_image "$native_root/candidate.json")
          [[ "$composition" =~ ^[a-f0-9]{64}$ ]]
          [[ "$derivation" =~ ^[a-f0-9]{64}$ ]]
          [[ "$expected_image" =~ ^sha256:[a-f0-9]{64}$ ]]
          jq -e --arg identity "$composition" '.identity == $identity' \
            "$native_root/composition/composition.json" > /dev/null
          jq -e --arg identity "$derivation" --arg parent "$composition" \
            '.identity == $identity and .definition.parent_identity == $parent' \
            "$native_root/native-plan.json" > /dev/null
          endpoint="unix://$(readlink -f /var/run/docker.sock)"
          test "$(docker --host "$endpoint" info --format '{{.ID}}')" = \
            "$(jq -er .engine "$native_root/candidate.json")"
          cp "$native_root/candidate.json" "$evidence/composer-candidate.json"
          sha256sum "$native_root/composition/composition.json" \
            "$native_root/native-plan.json" > "$evidence/selected-inputs.sha256"
          env -u DOCKER_CONTEXT -u DOCKER_TLS -u DOCKER_TLS_VERIFY -u DOCKER_CERT_PATH -u KEDRA_LAB_BINARIES \
            DOCKER_HOST="$endpoint" DOCKER_CONFIG="$native_root/home/.docker" \
            KEDRA_LAB_TARGET="$KEDRA_TARGET" KEDRA_LAB_OVERLAY=none KEDRA_LAB_KEEP=never \
            KEDRA_LAB_IMAGE="composition:$native_root/composition" \
            KEDRA_LAB_COMPOSITION_IDENTITY="$composition" \
            KEDRA_LAB_SYSROOT="$GITHUB_WORKSPACE/output/release-binaries/sysroot" \
            KEDRA_LAB_DERIVATION_IDENTITY="$derivation" \
            rustup run 1.98.1 cargo test -p kedra-container-tests --test container --release --locked \
              -- native::catalog --exact --test-threads 1 2>&1 | tee "$evidence/harness.log"
          mapfile -t reports < <(find "$KEDRA_LAB_ARTIFACTS/runs" -mindepth 2 -maxdepth 2 -name report.json -type f)
          test "${#reports[@]}" -eq 1
          jq -e --arg target "$KEDRA_TARGET" --arg image "$expected_image" --arg source "native:$derivation" '
            .schema_version == 1 and .selected_count == 1 and .interrupted == false
            and .image.target == $target and .image.base == $image
            and .image.name == "sha256" and .image.tag == ($image | ltrimstr("sha256:"))
            and .image.source == $source and .image.overlay == null
            and (.results | length) == 1 and .results[0].name == "native::catalog"
            and .results[0].outcome == "passed" and .results[0].cleanup_failure == null
            and .results[0].retained_container == null
          ' "${reports[0]}" > /dev/null
          cp "${reports[0]}" "$evidence/validated-report.json"
      - name: Preserve installed catalog diagnostics
        if: always() && steps.preflight.outputs.changed == 'true'
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/kedra-release-store.release-lab/runs"
          if test -d "$reports"; then
            mkdir -p output/image-evidence/catalog-installed
            cp -R "$reports" output/image-evidence/catalog-installed/
          fi
      - name: Validate actual image identity and material without execution
        id: inspect
        if: steps.preflight.outputs.changed == 'true'
        run: uv run usr/src/kedra/image/release/refresh.py inspect-candidate --target "$KEDRA_TARGET" --work output/image-evidence
      # After a successful build, offer every realized package closure to the cache.
      # Consumers admit one only against a signed image's records, so a failed push
      # costs a later rebuild and never fails the release.
      - name: Push realized package closures to the binary cache
        if: steps.preflight.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEDRA_CACHE: ${{ steps.target.outputs.cache }}
        run: |
          set -euo pipefail
          auth="$RUNNER_TEMP/kedra-cache-auth.json"
          umask 077
          trap 'rm -f -- "$auth"' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$auth" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          mapfile -t objects < <(jq -r '[.outputs[]] | unique[]' "$RUNNER_TEMP/kedra-catalog/contribution-result.json")
          for object in "${objects[@]}"; do
            output/release-binaries/sysroot store push --store "$RUNNER_TEMP/kedra-release-store" --object "$object" \
              --cache "$KEDRA_CACHE" --cache-authfile "$auth" --source "https://github.com/$GITHUB_REPOSITORY" \
              | tee -a output/image-evidence/catalog/cache-push.jsonl
          done
      # Unsigned builds grant nothing; the exact-main guard runs at preflight and
      # again before the signer and stable publication use this digest.
      - name: Publish immutable unsigned build for isolated signing
        id: publish
        if: steps.preflight.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$RUNNER_TEMP/kedra-build-auth.json"
          umask 077
          trap 'rm -f -- "$auth"' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$auth" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          builds=$(jq -er --arg target "$KEDRA_TARGET" '.targets[$target].builds' usr/src/kedra/image/release/targets.json)
          destination="$builds:run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if skopeo inspect --authfile "$auth" --raw "docker://$destination" > /dev/null 2> "$RUNNER_TEMP/build-tag-lookup.log"; then
            echo 'Immutable build tag already exists'; exit 1
          fi
          grep -q 'manifest unknown' "$RUNNER_TEMP/build-tag-lookup.log"
          native_digest="sha256:$(sudo skopeo inspect --raw "containers-storage:localhost/kedra-$KEDRA_TARGET:release-candidate" | sha256sum | cut -d ' ' -f 1)"
          sudo skopeo copy --authfile "$auth" --preserve-digests --digestfile output/image-evidence/candidate.digest \
            "containers-storage:localhost/kedra-$KEDRA_TARGET:release-candidate" "docker://$destination"
          digest=$(cat output/image-evidence/candidate.digest)
          test "$digest" = "$native_digest"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Retain changed-image review or failure evidence
        if: always() && steps.preflight.outputs.changed != 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-build-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/image-evidence/
          if-no-files-found: error
          retention-days: 30

  validate-candidate:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    env:
      CARGO_TERM_COLOR: always
      KEDRA_TARGET: ${{ inputs.target }}
      CANDIDATE_DIGEST: ${{ needs.build.outputs.digest }}
      KEDRA_LAB_TARGET: ${{ inputs.target }}
      # Exercise the exact installed candidate. A worktree overlay would replace
      # its sysroot binaries and could hide a compatibility failure.
      KEDRA_LAB_OVERLAY: none
      KEDRA_LAB_ARTIFACTS: ${{ github.workspace }}/output/kedra-lab
    outputs:
      digest: ${{ steps.validated.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the containerd Docker image store
        timeout-minutes: 2
        run: usr/src/kedra/image/release/runner-containerd.sh
      - name: Select the immutable public candidate by digest
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$(jq -er --arg target "$KEDRA_TARGET" '.targets[$target].architecture' usr/src/kedra/image/release/targets.json)" = "$(uname -m)"
          builds=$(jq -er --arg target "$KEDRA_TARGET" '.targets[$target].builds' usr/src/kedra/image/release/targets.json)
          reference="$builds@$CANDIDATE_DIGEST"
          mkdir -p "$KEDRA_LAB_ARTIFACTS"
          printf 'KEDRA_LAB_IMAGE=ref:%s\n' "$reference" >> "$GITHUB_ENV"
          printf 'KEDRA_CANDIDATE_REFERENCE=%s\n' "$reference" >> "$GITHUB_ENV"
          printf '%s\n' "$reference" > "$KEDRA_LAB_ARTIFACTS/candidate-reference.txt"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Record the candidate test environment
        run: |
          {
            date --utc --iso-8601=seconds
            uname -a
            nproc
            free -h
            df -h
            docker version
            docker info --format '{{.CgroupVersion}} {{.CgroupDriver}} {{.Driver}}'
          } > "$KEDRA_LAB_ARTIFACTS/environment.txt"
      - name: Keep Ubuntu host AppArmor policy off the candidate's programs
        run: usr/src/kedra/image/release/runner-apparmor.sh "$KEDRA_LAB_ARTIFACTS"
      - name: Validate scenarios before provisioning anything
        run: cargo test -p kedra-container-tests --test container --locked -- --list
      - name: Run the full container harness against the exact candidate
        run: cargo test -p kedra-container-tests --test container --locked
      - name: Bind successful harness evidence to the candidate digest
        id: validated
        run: |
          set -euo pipefail
          mapfile -t reports < <(find "$KEDRA_LAB_ARTIFACTS/runs" -mindepth 2 -maxdepth 2 -name report.json -type f)
          test "${#reports[@]}" -eq 1
          jq -e --arg target "$KEDRA_TARGET" --arg reference "$KEDRA_CANDIDATE_REFERENCE" '
            .schema_version == 1 and .selected_count > 0
            and .selected_count == (.results | length) and .interrupted == false
            and .image.target == $target and .image.source == $reference and .image.overlay == null
            and all(.results[]; .outcome == "passed" and .cleanup_failure == null)
          ' "${reports[0]}" > /dev/null
          printf 'digest=%s\n' "$CANDIDATE_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Record host AppArmor denials
        if: failure()
        run: sudo dmesg | grep -F 'apparmor="DENIED"' | tail -n 200 > "$KEDRA_LAB_ARTIFACTS/apparmor-denials.txt" || true
      - name: Preserve exact-candidate reports and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-container-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/kedra-lab/candidate-reference.txt
            output/kedra-lab/environment.txt
            output/kedra-lab/apparmor-*.txt
            output/kedra-lab/runs/
            output/kedra-lab/cache/build-context-*/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Scope of the candidate result
        if: always()
        run: |
          echo 'Validation scope: the full container harness must exercise the exact unsigned candidate digest with no worktree overlay.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Kernel boot, Secure Boot and enforcing SELinux remain separate VM gates.' >> "$GITHUB_STEP_SUMMARY"

  sign-image:
    needs: [build, validate-candidate]
    if: needs.build.outputs.changed == 'true' && needs.validate-candidate.result == 'success'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    # Only this job declares the signing environment, so only it resolves the
    # environment secrets that release.yml's inherited context makes visible.
    environment: kedra-${{ inputs.target }}-signing
    permissions:
      contents: read
      packages: write
    env:
      KEDRA_TARGET: ${{ inputs.target }}
    outputs:
      digest: ${{ steps.sign.outputs.digest }}
      fingerprint: ${{ steps.sign.outputs.fingerprint }}
    steps:
      # No checkout, artifact execution, candidate process or repository script in
      # this job. The closed target table is read as data at the exact commit.
      - name: Prepare native signer and validate public image identity
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_DIGEST: ${{ needs.validate-candidate.outputs.digest }}
          BUILD_DIGEST: ${{ needs.build.outputs.digest }}
          IDENTITY_SHA256: ${{ needs.build.outputs.identity_sha256 }}
        run: |
          set -euo pipefail
          test "$CANDIDATE_DIGEST" = "$BUILD_DIGEST"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/Reidond/kedra/contents/usr/src/kedra/image/release/targets.json?ref=$GITHUB_SHA" > "$RUNNER_TEMP/targets.json"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo openssl
          # The signer writes sigstore attachments; it runs no repository script, so
          # this is the one inline copy of trust.py's registries entry.
          sudo mkdir -p /etc/containers/registries.d
          printf 'docker:\n  ghcr.io:\n    use-sigstore-attachments: true\n' | sudo tee /etc/containers/registries.d/kedra.yaml >/dev/null
          python3 - <<'PY'
          import hashlib, json, os, platform, re, subprocess
          table = json.loads(open(os.path.join(os.environ['RUNNER_TEMP'], 'targets.json'), 'rb').read(16384))
          assert table['schema_version'] == 1
          target = os.environ['KEDRA_TARGET']
          spec = table['targets'][target]
          architecture, oci_architecture = spec['architecture'], spec['oci_architecture']
          repository = spec['repository']
          assert platform.machine() == architecture
          assert repository == 'ghcr.io/reidond/kedra-' + target and spec['builds'] == repository + '-builds'
          digest = os.environ['CANDIDATE_DIGEST']
          assert re.fullmatch(r'sha256:[a-f0-9]{64}', digest)
          config = json.loads(subprocess.check_output(['skopeo', 'inspect', '--config', '--raw',
              'docker://' + spec['builds'] + '@' + digest]))
          raw = config['config']['Labels']['org.kedra.image.identity']
          assert hashlib.sha256(raw.encode()).hexdigest() == os.environ['IDENTITY_SHA256']
          identity = json.loads(raw)
          assert config['os'] == 'linux' and config['architecture'] == oci_architecture
          assert identity['schema_version'] == 2 and identity['project'] == 'Kedra'
          assert identity['source_revision'] == os.environ['GITHUB_SHA']
          assert identity['repository'] == repository and identity['channel'] == 'stable'
          assert identity['target'] == target and identity['architecture'] == architecture and identity['fedora_release'] == 44
          assert identity['workflow'] == '.github/workflows/release.yml' and identity['epoch'] == 1
          assert identity['run_number'] == int(os.environ['GITHUB_RUN_NUMBER'])
          assert identity['run_attempt'] == int(os.environ['GITHUB_RUN_ATTEMPT'])
          PY
          repository=$(jq -er --arg target "$KEDRA_TARGET" '.targets[$target].repository' "$RUNNER_TEMP/targets.json")
          destination="$repository:run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if skopeo inspect --raw "docker://$destination" >/dev/null 2>"$RUNNER_TEMP/signed-tag-lookup.log"; then
            echo 'Immutable signed run tag already exists'; exit 1
          fi
          grep -q 'manifest unknown' "$RUNNER_TEMP/signed-tag-lookup.log"
      - name: Automatically sign exact validated image with isolated authority
        id: sign
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_DIGEST: ${{ needs.validate-candidate.outputs.digest }}
          BUILD_DIGEST: ${{ needs.build.outputs.digest }}
          BUILD_FINGERPRINT: ${{ needs.build.outputs.fingerprint }}
          # Explicit per-target selection; an unknown target selects nothing.
          APPROVED_FINGERPRINT: ${{ inputs.target == 'desktop' && vars.KEDRA_DESKTOP_KEY_SHA256 || inputs.target == 'qemu-arm64' && vars.KEDRA_QEMU_ARM64_KEY_SHA256 || '' }}
          RELEASE_PRIVATE_KEY: ${{ inputs.target == 'desktop' && secrets.KEDRA_DESKTOP_SIGNING_KEY || inputs.target == 'qemu-arm64' && secrets.KEDRA_QEMU_ARM64_SIGNING_KEY || '' }}
          RELEASE_PUBLIC_KEY: ${{ inputs.target == 'desktop' && vars.KEDRA_DESKTOP_PUBLIC_KEY || inputs.target == 'qemu-arm64' && vars.KEDRA_QEMU_ARM64_PUBLIC_KEY || '' }}
          RELEASE_PASSPHRASE: ${{ inputs.target == 'desktop' && secrets.KEDRA_DESKTOP_SIGNING_PASSPHRASE || inputs.target == 'qemu-arm64' && secrets.KEDRA_QEMU_ARM64_SIGNING_PASSPHRASE || '' }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$CANDIDATE_DIGEST" = "$BUILD_DIGEST"
          [[ "$APPROVED_FINGERPRINT" =~ ^[a-f0-9]{64}$ ]]
          test "$BUILD_FINGERPRINT" = "$APPROVED_FINGERPRINT"
          # Exact main immediately before the private key is used.
          test "$(gh api repos/Reidond/kedra/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
          repository=$(jq -er --arg target "$KEDRA_TARGET" '.targets[$target].repository' "$RUNNER_TEMP/targets.json")
          builds=$(jq -er --arg target "$KEDRA_TARGET" '.targets[$target].builds' "$RUNNER_TEMP/targets.json")
          # Separate commands: under bash -e a failing left side of && does not stop the step.
          test -n "$RELEASE_PRIVATE_KEY"
          test -n "$RELEASE_PASSPHRASE"
          umask 077
          private=$(mktemp -d "$RUNNER_TEMP/kedra-signing.XXXXXXXX")
          trap 'rm -rf -- "$private"' EXIT
          printf '%s\n' "$RELEASE_PUBLIC_KEY" > "$private/release.pub"
          openssl pkey -pubin -in "$private/release.pub" -outform DER -out "$private/public.der"
          test "$(sha256sum "$private/public.der" | cut -d ' ' -f 1)" = "$APPROVED_FINGERPRINT"
          printf '%s\n' "$RELEASE_PRIVATE_KEY" > "$private/release.private"
          printf '%s' "$RELEASE_PASSPHRASE" > "$private/passphrase"
          unset RELEASE_PRIVATE_KEY RELEASE_PASSPHRASE
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$private/auth.json" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          skopeo copy --authfile "$private/auth.json" --preserve-digests --digestfile "$private/signed.digest" \
            --sign-by-sigstore-private-key "$private/release.private" --sign-passphrase-file "$private/passphrase" \
            "docker://$builds@$CANDIDATE_DIGEST" \
            "docker://$repository:run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test "$(cat "$private/signed.digest")" = "$CANDIDATE_DIGEST"
          printf 'digest=%s\n' "$CANDIDATE_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'fingerprint=%s\n' "$APPROVED_FINGERPRINT" >> "$GITHUB_OUTPUT"

  publish-stable:
    needs: [build, sign-image]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      KEDRA_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.19
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-build-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/image-evidence
      - name: Strictly verify signed image and advance stable
        env:
          GH_TOKEN: ${{ github.token }}
          KEDRA_SIGNED_DIGEST: ${{ needs.sign-image.outputs.digest }}
          APPROVED_FINGERPRINT: ${{ needs.sign-image.outputs.fingerprint }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman skopeo openssl
          umask 077
          auth_dir=$(mktemp -d "$RUNNER_TEMP/kedra-publish-auth.XXXXXXXX")
          auth="$auth_dir/auth.json"
          trap 'rm -rf -- "$auth_dir"' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$auth" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          export KEDRA_REGISTRY_AUTH="$auth"
          # refresh.py checks exact main and the preflight's stable digest once, right before the stable write.
          uv run usr/src/kedra/image/release/refresh.py publish --target "$KEDRA_TARGET" --work output/image-evidence
      - name: Preserve public stable publication receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-publication-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/image-evidence/
          if-no-files-found: error
          retention-days: 90

  # The target's binary cache keeps only the package closures the stable image just
  # published records: consumers admit nothing else, so older closures can never be
  # used again. Signed images are untouched (no image garbage collection). A
  # failure here leaves extra closures behind and never fails the release.
  prune-cache:
    needs: [build, publish-stable]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      packages: write
    env:
      KEDRA_TARGET: ${{ inputs.target }}
      KEDRA_CACHE: ${{ needs.build.outputs.cache }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-build-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/image-evidence
      - name: Delete cache closures the new stable image does not record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          catalog=output/image-evidence/catalog
          # Keep exactly the tags this run pushed or found; prune only when every
          # contributed output has one, so a failed push never empties the cache.
          expected=$(jq -er '[.outputs[]] | unique | length' "$catalog/contribution-result.json")
          jq -es --argjson expected "$expected" \
            'length == $expected and all(.[]; .tag | test("^closure-[0-9a-f]{64}$"))' "$catalog/cache-push.jsonl" >/dev/null
          jq -r '.tag' "$catalog/cache-push.jsonl" | sort -u > "$RUNNER_TEMP/kedra-cache-keep"
          [[ "$KEDRA_CACHE" =~ ^ghcr\.io/reidond/kedra-cache-[a-z0-9-]+$ ]]
          package="${KEDRA_CACHE#ghcr.io/reidond/}"
          gh api --paginate "/users/Reidond/packages/container/$package/versions" \
            --jq '.[] | [(.id | tostring), ((.metadata.container.tags // []) | join(" "))] | @tsv' > "$RUNNER_TEMP/kedra-cache-versions"
          while IFS=$'\t' read -r id tags; do
            keep=false
            for tag in $tags; do
              if grep -qxF "$tag" "$RUNNER_TEMP/kedra-cache-keep"; then keep=true; fi
            done
            if test "$keep" = false; then
              gh api --method DELETE "/users/Reidond/packages/container/$package/versions/$id"
              printf 'deleted %s %s\n' "$id" "${tags:-untagged}"
            fi
          done < "$RUNNER_TEMP/kedra-cache-versions"
