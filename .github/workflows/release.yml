name: Build signed bootc updates

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-target.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - etc/**
      - usr/**
      - '!usr/src/kedra/**'
      - crates/**
      - usr/src/kedra/image/**
      - usr/src/kedra/tests/container/**

permissions:
  contents: read

# One serialized release run publishes every enabled target. Each target keeps
# its own repository, key, signing environment, rank and stable tag.
concurrency:
  group: release-44
  cancel-in-progress: false

jobs:
  # The closed target table is usr/src/kedra/image/release/targets.json at this
  # exact commit, read as data through the API.
  targets:
    if: github.repository == 'Reidond/kedra' && github.ref == 'refs/heads/main' && vars.KEDRA_RELEASES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.table.outputs.matrix }}
    steps:
      - name: Read the closed release target table
        id: table
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/Reidond/kedra/contents/usr/src/kedra/image/release/targets.json?ref=$GITHUB_SHA" > "$RUNNER_TEMP/targets.json"
          matrix=$(jq -ce 'if .schema_version == 1 then {include: [.targets | to_entries[] | {target: .key, runner: .value.runner}]}
            else error("Unsupported release target table") end' "$RUNNER_TEMP/targets.json")
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  # Independent targets: a failure in one never blocks the other (fail-fast off).
  # A called job sees its environment's secrets only when the caller inherits
  # secrets (probe run 36191986665: empty without inherit, present with it).
  # The repository has no repository-level secrets; each signer job still reads
  # only its own protected environment inside release-target.yml.
  release:
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    uses: ./.github/workflows/release-target.yml
    permissions:
      contents: read
      actions: read
      packages: write
    secrets: inherit
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
