name: Build signed bootc updates

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-target.yml
      - Containerfile
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**
      - packages/**
      - etc/**
      - usr/**
      - home/**
      - hosts/**
      - build/**

permissions:
  contents: read

# One serialized release run publishes every enabled target. Each target keeps
# its own repository, key, signing environment, rank and stable tag.
concurrency:
  group: release-44
  cancel-in-progress: false

jobs:
  # Independent callers: a failure in one target never blocks the other.
  # A called job sees its environment's secrets only when the caller inherits
  # secrets (probe run 36191986665: empty without inherit, present with it).
  # The repository has no repository-level secrets; each signer job still reads
  # only its own protected environment inside release-target.yml.
  desktop:
    if: github.repository == 'Reidond/kedra' && github.ref == 'refs/heads/main' && vars.KEDRA_RELEASES_ENABLED == 'true'
    uses: ./.github/workflows/release-target.yml
    permissions:
      contents: read
      actions: read
      packages: write
    secrets: inherit
    with:
      target: desktop
      runner: ubuntu-24.04

  utm:
    if: github.repository == 'Reidond/kedra' && github.ref == 'refs/heads/main' && vars.KEDRA_RELEASES_ENABLED == 'true'
    uses: ./.github/workflows/release-target.yml
    permissions:
      contents: read
      actions: read
      packages: write
    secrets: inherit
    with:
      target: utm
      runner: ubuntu-24.04-arm
