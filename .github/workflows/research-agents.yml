name: Research private agent runtimes
on:
  workflow_dispatch:
  push:
    branches: [codex/usable-system]
    paths:
      - .github/workflows/research-agents.yml
      - build/agents/**
      - build/research/r05/**
      - crates/sysroot/agents/**
      - crates/sysroot/agents.rs
permissions:
  contents: read
concurrency:
  group: research-agents-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    if: github.repository == 'Reidond/kedra' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build checked launcher
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo build --workspace --release --locked
      - name: Fetch pinned official research inputs
        run: |
          mkdir -p output/r05-evidence
          python3 build/agents/fetch.py --output "$RUNNER_TEMP/kedra-r05-inputs" --research-tools
          cp build/agents/inputs.json output/r05-evidence/
          cp -a "$RUNNER_TEMP/kedra-r05-inputs/notices" output/r05-evidence/
          sha256sum "$RUNNER_TEMP/kedra-r05-inputs/notices/"* > output/r05-evidence/notice-hashes.txt
      - name: Verify signatures and prepare the private image package
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/kedra-r05-inputs"
          python3 build/agents/package.py --inputs "$inputs" \
            --output "$RUNNER_TEMP/kedra-agents.tar" --evidence output/r05-evidence/image-package.json
      - name: Probe native wrappers without model access
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/kedra-r05-inputs"
          sudo mkdir -p /usr/libexec/sysroot/agents
          sudo cp -a "$inputs/codex" /usr/libexec/sysroot/agents/codex
          sudo chown -R root:root /usr/libexec/sysroot/agents/codex
          # Drop privileges before running checkout test code; no network access.
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            python3 build/research/r05/run.py --sysroot "$PWD/target/release/sysroot" \
            --packages "$inputs" --work "$RUNNER_TEMP/kedra-r05-probe" \
            --evidence "$PWD/output/r05-evidence" | tee output/r05-evidence/probe-result.txt
      - name: Preserve safe evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r05-agent-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/r05-evidence/
          if-no-files-found: error
          retention-days: 14
