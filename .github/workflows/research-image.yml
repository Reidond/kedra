name: Research image and VM

on:
  workflow_dispatch:
  push:
    branches: [codex/usable-system]
    paths:
      - .github/workflows/research-image.yml
      - build/research/Containerfile
      - build/research/boot-check.sh
      - build/research/boot-check.service
      - build/research/console.toml
      - build/research/inputs.json

permissions:
  contents: read

concurrency:
  group: research-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  minimal-vm:
    if: github.repository == 'Reidond/kedra' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install runner tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman skopeo qemu-system-x86 qemu-utils ovmf
      - name: Record runner and pinned inputs
        run: |
          mkdir -p output/evidence output/image
          cp build/research/inputs.json output/evidence/
          {
            date --utc --iso-8601=seconds
            git rev-parse HEAD
            uname -a
            free -h
            df -h
            ls -l /dev/kvm
            podman --version
            skopeo --version
            qemu-system-x86_64 --version
          } | tee output/evidence/environment.txt
          echo 'Research only: no production keys, registry publication, installer or hardware qualification.' >> "$GITHUB_STEP_SUMMARY"
      - name: Build pinned minimal Fedora bootc fixture
        run: |
          set -euo pipefail
          base=$(jq -er .base build/research/inputs.json)
          sudo podman build --pull=always --no-cache --build-arg "BASE_IMAGE=$base" \
            --tag localhost/kedra-research:r02 --file build/research/Containerfile build/research \
            2>&1 | tee output/evidence/container-build.log
          sudo podman image inspect localhost/kedra-research:r02 > output/evidence/image-inspect.json
          sudo podman run --rm localhost/kedra-research:r02 rpm -qa | sort > output/evidence/packages.txt
          sudo podman run --rm localhost/kedra-research:r02 bootc container lint \
            2>&1 | tee output/evidence/container-lint.log
      - name: Build QCOW2 with pinned builder
        run: |
          set -euo pipefail
          builder=$(jq -er .builder build/research/inputs.json)
          sudo podman run --rm "$builder" --version | tee output/evidence/builder-version.txt
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            -v "$PWD/output/image:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "$builder" --type qcow2 --rootfs ext4 --use-librepo=True \
            localhost/kedra-research:r02 2>&1 | tee output/evidence/qcow2-build.log
          sudo chown -R "$(id -u):$(id -g)" output
          find output/image -type f -printf '%P %s bytes\n' > output/evidence/artifact-sizes.txt
      - name: Boot disposable UEFI VM
        run: |
          set -euo pipefail
          mapfile -t disks < <(find "$PWD/output/image" -name '*.qcow2' -type f)
          test "${#disks[@]}" -eq 1
          cp /usr/share/OVMF/OVMF_VARS_4M.fd output/OVMF_VARS.fd
          sudo timeout 300 qemu-system-x86_64 \
            -machine q35,accel=kvm -cpu host -smp 2 -m 4096 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file="$PWD/output/OVMF_VARS.fd" \
            -drive "file=${disks[0]},if=virtio,format=qcow2,snapshot=on" \
            -display none -serial stdio -monitor none -nic none \
            2>&1 | tee output/evidence/serial.log
          grep -q 'KEDRA_R02_BOOT_PASS' output/evidence/serial.log
          ! grep -q 'KEDRA_R02_BOOT_FAIL' output/evidence/serial.log
          sha256sum "${disks[0]}" > output/evidence/SHA256SUMS
      - name: Preserve research evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r02-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve boot-tested disposable disk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r02-qcow2-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/image/**/*.qcow2
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
