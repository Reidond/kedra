name: Research RPM refresh
on:
  workflow_dispatch:
  push:
    branches: [codex/usable-system]
    paths:
      - .github/workflows/research-refresh.yml
      - build/research/refresh/**
      - build/research/inputs.json
permissions:
  contents: read
concurrency:
  group: research-refresh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rpm-refresh:
    if: github.repository == 'Reidond/kedra' && github.ref == 'refs/heads/codex/usable-system'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install runner container tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman
      - name: Materialize signed RPM snapshots with native Fedora tools
        run: python3 build/research/refresh/run.py
      - name: Retain public native evidence, including expected refusals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpm-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/refresh-evidence/
          if-no-files-found: error
          retention-days: 14
