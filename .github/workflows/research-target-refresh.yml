name: Research full desktop resolution evidence

on:
  workflow_dispatch:
  push:
    branches: [codex/usable-system]
    paths:
      - .github/workflows/research-target-refresh.yml
      - build/research/refresh/target.py
      - build/research/refresh/target-native.sh
      - build/research/refresh/target-dnf.sh
      - build/research/refresh/Containerfile.target
      - build/research/inputs.json
      - Containerfile
      - build/assemble.sh
      - build/release/Containerfile
      - build/release/prepare-trust.py
      - build/agents/prepare.sh
      - build/agents/fetch.py
      - build/agents/package.py
      - build/agents/inputs.json
      - build/bitwarden/prepare.py
      - build/bitwarden/inputs.json

permissions:
  contents: read

concurrency:
  group: research-target-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop-resolution:
    if: github.repository == 'Reidond/kedra' && github.ref == 'refs/heads/codex/usable-system'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman skopeo rpm cpio
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --test 'e2e_*' --locked
          cargo build --workspace --release --locked
      - name: Materialize actual desktop twice and retain native resolution inputs
        run: python3 build/research/refresh/target.py
      - name: Retain public evidence including exact transaction RPM archives
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-resolution-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/target-refresh-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
