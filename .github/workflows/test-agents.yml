name: Test private agent runtimes
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/test-agents.yml
      - usr/src/kedra/image/agents/**
      - usr/src/kedra/image/release/targets.json
      - usr/src/kedra/tests/agents/**
      - usr/src/kedra/crates/sysroot/agents/**
      - usr/src/kedra/crates/sysroot/agents.rs
permissions:
  contents: read
concurrency:
  group: test-agents-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    if: github.repository == 'Reidond/kedra' && github.event_name != 'pull_request'
    # Each target's official Codex runs natively on its own architecture.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: desktop
            runner: ubuntu-24.04
          - target: qemu-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      KEDRA_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.19
          enable-cache: false
      - name: Build checked launcher
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --test 'e2e_*' --locked
          cargo build --workspace --release --locked
      - name: Fetch pinned official research inputs
        run: |
          mkdir -p output/r05-evidence
          uv run usr/src/kedra/image/agents/fetch.py --target "$KEDRA_TARGET" --output "$RUNNER_TEMP/kedra-r05-inputs" --research-tools
          cp usr/src/kedra/image/agents/inputs.json output/r05-evidence/
          cp -a "$RUNNER_TEMP/kedra-r05-inputs/notices" output/r05-evidence/
          sha256sum "$RUNNER_TEMP/kedra-r05-inputs/notices/"* > output/r05-evidence/notice-hashes.txt
      - name: Verify signatures and prepare the private image package
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/kedra-r05-inputs"
          uv run usr/src/kedra/image/agents/package.py --target "$KEDRA_TARGET" --inputs "$inputs" \
            --output "$RUNNER_TEMP/kedra-agents.tar" --evidence output/r05-evidence/image-package.json
      - name: Probe native wrappers without model access
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/kedra-r05-inputs"
          sudo mkdir -p /usr/libexec/sysroot/agents
          sudo cp -a "$inputs/codex" /usr/libexec/sysroot/agents/codex
          sudo chown -R root:root /usr/libexec/sysroot/agents/codex
          # Drop privileges before running checkout test code; no network access.
          # sudo resets PATH and HOME: pass the pinned uv, the runner home and an
          # offline cache (the probe script has no dependencies).
          uv=$(command -v uv)
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            env HOME="$HOME" UV_CACHE_DIR="$RUNNER_TEMP/kedra-r05-uv-cache" UV_OFFLINE=1 \
            "$uv" run usr/src/kedra/tests/agents/run.py --sysroot "$PWD/target/release/sysroot" \
            --packages "$inputs" --work "$RUNNER_TEMP/kedra-r05-probe" \
            --evidence "$PWD/output/r05-evidence" | tee output/r05-evidence/probe-result.txt
      - name: Preserve safe evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r05-agent-evidence-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/r05-evidence/
          if-no-files-found: error
          retention-days: 14
