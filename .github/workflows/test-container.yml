name: Test container scenarios
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/test-container.yml
      - etc/**
      - usr/**
      - '!usr/src/kedra/**'
      - usr/src/kedra/image/Containerfile
      - usr/src/kedra/image/assemble.sh
      - usr/src/kedra/image/inputs.json
      - usr/src/kedra/image/packages.list
      - usr/src/kedra/image/package-inputs.json
      - usr/src/kedra/image/package-policy.json
      - usr/src/kedra/image/packages/**
      - usr/src/kedra/image/remove.list
      - usr/src/kedra/image/agents/**
      - usr/src/kedra/image/bitwarden/**
      - usr/src/kedra/image/release/targets.json
      - usr/src/kedra/image/targets/**
      - usr/src/kedra/tests/container/**
      - usr/src/kedra/tests/common/test-profile.toml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - usr/src/kedra/crates/**
permissions:
  contents: read
concurrency:
  group: test-container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scenarios:
    if: github.repository == 'Reidond/kedra' && github.event_name != 'pull_request'
    name: scenarios (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: desktop
            runner: ubuntu-24.04
          - target: qemu-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      # The same full image build a developer runs with `kedra-lab image --image build`:
      # this commit's candidate, built natively, with no working-tree overlay.
      KEDRA_LAB_TARGET: ${{ matrix.target }}
      KEDRA_LAB_IMAGE: build
      KEDRA_LAB_OVERLAY: none
      KEDRA_LAB_ARTIFACTS: ${{ github.workspace }}/output/kedra-lab
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Record the environment
        run: |
          mkdir -p output/kedra-lab
          {
            date --utc --iso-8601=seconds
            uname -a
            nproc
            free -h
            df -h
            docker version
            docker info --format '{{.CgroupVersion}} {{.CgroupDriver}} {{.Driver}}'
          } > output/kedra-lab/environment.txt
      - name: Keep Ubuntu host AppArmor policy off the container's own programs
        run: |
          # Measured on ubuntu-24.04 runners (runs 36313894034, 36315527414):
          # - the unix-chkpwd profile attaches by path, also to the Fedora
          #   /usr/sbin/unix_chkpwd inside the OS container, which then cannot
          #   read that container's accounts; PAM refuses the user manager.
          # - apparmor_restrict_unprivileged_userns puts user namespaces under
          #   the unprivileged_userns profile, denying Bitwarden's Chromium
          #   sandbox and bwrap (CAP_SYS_ADMIN/SETPCAP/NET_ADMIN).
          # Relax exactly these on this disposable runner.
          sudo aa-status > output/kedra-lab/apparmor-before.txt 2>&1 || true
          if test -f /etc/apparmor.d/unix-chkpwd; then
            sudo apparmor_parser --remove /etc/apparmor.d/unix-chkpwd
          fi
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo aa-status > output/kedra-lab/apparmor-after.txt 2>&1 || true
      - name: Validate scenarios before provisioning anything
        run: cargo test -p kedra-container-tests --test container --locked -- --list
      - name: Qualify package-format migration against the retained main reader
        timeout-minutes: 30
        run: |
          set -euo pipefail
          baseline=$(git merge-base origin/main HEAD)
          if ! test -f usr/src/kedra/image/package-inputs.json || \
             ! git cat-file -e "$baseline:usr/src/kedra/image/packages.list" 2>/dev/null; then
            echo 'No list-to-language migration in this branch' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cargo build -p sysroot --release --locked
          evidence="$GITHUB_WORKSPACE/output/package-migration"
          mkdir -p "$evidence/legacy-source" "$evidence/legacy" "$evidence/language"
          git archive "$baseline" | tar -xf - -C "$evidence/legacy-source"
          git -C "$evidence/legacy-source" init --quiet
          git -C "$evidence/legacy-source" add .
          git -C "$evidence/legacy-source" -c core.hooksPath=/dev/null \
            -c user.name='Kedra qualification' -c user.email='qualification@invalid' commit --quiet -m fixture
          target/release/sysroot source plan --repo "$evidence/legacy-source" --host "$KEDRA_LAB_TARGET" --json > "$evidence/legacy/plan.json"
          target/release/sysroot source plan --host "$KEDRA_LAB_TARGET" --json > "$evidence/language/plan.json"
          target/release/sysroot source plan --host "$KEDRA_LAB_TARGET" --json > "$evidence/language/repeat.json"
          cmp "$evidence/language/plan.json" "$evidence/language/repeat.json"
          jq -S '{packages,remove_packages}' "$evidence/legacy/plan.json" > "$evidence/legacy/requests.json"
          jq -S '{packages,remove_packages}' "$evidence/language/plan.json" > "$evidence/language/requests.json"
          cmp "$evidence/legacy/requests.json" "$evidence/language/requests.json"
          target/release/sysroot source archive --repo "$evidence/legacy-source" --host "$KEDRA_LAB_TARGET" --output "$evidence/legacy/payload.tar"
          target/release/sysroot source archive --host "$KEDRA_LAB_TARGET" --output "$evidence/language/payload.tar"
          docker pull quay.io/fedora/fedora-bootc:44
          base=$(docker image inspect quay.io/fedora/fedora-bootc:44 --format '{{.Id}}')
          docker image inspect "$base" > "$evidence/base.json"
          for format in legacy language; do
            context="$evidence/$format"
            cp usr/src/kedra/image/assemble.sh "$context/assemble.sh"
            docker run --rm --pull=never --mount "type=bind,source=$context,target=/context,readonly" \
              --mount "type=bind,source=$context,target=/resolution" --entrypoint /bin/bash "$base" -euc \
              'tar -xf /context/payload.tar -C /; cp /context/assemble.sh /tmp/kedra-assemble.sh; exec /bin/bash /tmp/kedra-assemble.sh --resolve-packages' \
              > "$context/resolver.log" 2>&1
          done
          cmp "$evidence/legacy/package-material.txt" "$evidence/language/package-material.txt"
          sha256sum "$evidence/"*/package-material.txt > "$evidence/material.sha256"
          echo "Native $KEDRA_LAB_TARGET legacy/language requests, full observed RPM material and repeated language source plan agree" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the candidate and run the container scenarios
        run: cargo test -p kedra-container-tests --test container --locked
      - name: Record host AppArmor denials
        if: failure()
        run: sudo dmesg | grep -F 'apparmor="DENIED"' | tail -n 200 > output/kedra-lab/apparmor-denials.txt || true
      - name: Preserve reports, screenshots and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-scenarios-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/kedra-lab/environment.txt
            output/kedra-lab/apparmor-*.txt
            output/kedra-lab/runs/
            output/kedra-lab/cache/build-context-*/*.json
            output/package-migration/*.json
            output/package-migration/*.sha256
            output/package-migration/legacy/*.json
            output/package-migration/legacy/*.txt
            output/package-migration/legacy/*.log
            output/package-migration/language/*.json
            output/package-migration/language/*.txt
            output/package-migration/language/*.log
          if-no-files-found: error
          retention-days: 14
      - name: Scope of this result
        if: always()
        run: |
          echo 'Container scenarios boot the candidate with systemd as PID 1 and run the real Kedra session nested in a headless compositor.' >> "$GITHUB_STEP_SUMMARY"
          echo 'They do not boot a kernel: Secure Boot, SELinux enforcement, VT login, bootc updates and rollback remain VM workflows.' >> "$GITHUB_STEP_SUMMARY"
