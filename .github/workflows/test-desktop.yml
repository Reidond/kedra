name: Test desktop image
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/test-desktop.yml
      - etc/**
      - usr/**
      - '!usr/src/kedra/**'
      - usr/src/kedra/image/Containerfile
      - usr/src/kedra/image/assemble.sh
      - usr/src/kedra/image/inputs.json
      - usr/src/kedra/image/packages.list
      - usr/src/kedra/image/remove.list
      - usr/src/kedra/image/agents/**
      - usr/src/kedra/image/bitwarden/**
      - usr/src/kedra/image/release/material.py
      - usr/src/kedra/image/release/targets.json
      - usr/src/kedra/image/release/compatibility.json
      - usr/src/kedra/image/targets/desktop/**
      - usr/src/kedra/tests/vm/desktop/**
      - usr/src/kedra/tests/container/lab/probes/toolkit-app.py
      - usr/src/kedra/tests/common/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - usr/src/kedra/crates/**
permissions:
  contents: read
concurrency:
  group: test-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    if: github.repository == 'Reidond/kedra' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.19
          enable-cache: false
      - name: Build checked Rust tooling
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --test 'e2e_*' --locked
          cargo build --workspace --release --locked
      - name: Prepare explicit committed payload
        run: |
          mkdir -p output/desktop-evidence output/desktop-context
          target/release/sysroot source plan --host desktop --json > output/desktop-evidence/source.json
          target/release/sysroot source archive --host desktop --output output/desktop-context/payload.tar
          cp target/release/sysroot target/release/sysroot-helper usr/src/kedra/image/Containerfile usr/src/kedra/image/assemble.sh output/desktop-context/
          cp usr/src/kedra/image/inputs.json output/desktop-evidence/
          bash usr/src/kedra/image/agents/prepare.sh desktop output/desktop-context "$RUNNER_TEMP/kedra-agent-inputs" output/desktop-evidence/agent-inputs.json
          sha256sum output/desktop-context/* > output/desktop-evidence/build-input-hashes.txt
      - name: Install runner container tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman skopeo qemu-system-x86 qemu-system-gui qemu-utils ovmf python3-virt-firmware xvfb xauth mesa-utils imagemagick xdotool rpm cpio
          uv run usr/src/kedra/image/bitwarden/prepare.py --target desktop --context output/desktop-context --evidence output/desktop-evidence/bitwarden-inputs.json
          sha256sum output/desktop-context/* > output/desktop-evidence/build-input-hashes.txt
      - name: Build and validate Fedora desktop candidate
        run: |
          set -euo pipefail
          base=$(uv run usr/src/kedra/tests/common/resolve-fedora-base.py --output output/desktop-evidence/base-resolution.json)
          {
            date --utc --iso-8601=seconds
            uname -a
            free -h
            df -h
            podman --version
            skopeo --version
          } > output/desktop-evidence/environment.txt
          sudo podman build --pull=always --no-cache --build-arg "BASE_IMAGE=$base" \
            --tag localhost/kedra-desktop:research output/desktop-context \
            2>&1 | tee output/desktop-evidence/build.log
          sudo podman image inspect localhost/kedra-desktop:research > output/desktop-evidence/image-inspect.json
          sudo podman run --rm localhost/kedra-desktop:research cat /usr/share/sysroot/packages.txt > output/desktop-evidence/packages.txt
          sudo podman run --rm localhost/kedra-desktop:research find /var -type f > output/desktop-evidence/image-var-files.txt
          # Installed-image contents (programs, validated defaults, unit
          # enablement, toolkit packages, Bitwarden, Codex) are container
          # scenarios in test-container.yml; this VM qualifies boot and login.
      - name: Prepare disposable graphical login fixture
        run: |
          mkdir -p output/desktop-test-context output/desktop-image output/desktop-evidence/vm
          cp usr/src/kedra/tests/vm/desktop/Containerfile usr/src/kedra/tests/vm/desktop/check.sh usr/src/kedra/tests/vm/desktop/check.service usr/src/kedra/tests/common/test-profile.toml usr/src/kedra/tests/common/console.toml output/desktop-test-context/
          # The guest toolkit fixture is shared with the container scenarios.
          cp usr/src/kedra/tests/container/lab/probes/toolkit-app.py output/desktop-test-context/
          sudo podman build --pull=never --tag localhost/kedra-desktop-test:r07 output/desktop-test-context \
            > output/desktop-evidence/test-image-build.log 2>&1
          uv run python - <<'PY'
          import json, os, pathlib, secrets, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'kedra-r07-private'
          root.mkdir(mode=0o700)
          password = secrets.token_hex(16)
          (root / 'password').write_text(password)
          (root / 'password').chmod(0o600)
          hashed = subprocess.check_output(['openssl', 'passwd', '-6', '-stdin'], input=password.encode()).decode().strip()
          (root / 'blueprint.toml').write_text('[[customizations.user]]\nname = "kedra-test"\npassword = ' + json.dumps(hashed) + '\ngroups = ["wheel"]\n')
          (root / 'blueprint.toml').chmod(0o600)
          PY
      - name: Build disposable desktop disk
        run: |
          builder=$(jq -er .platforms.amd64.builder usr/src/kedra/image/inputs.json)
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            -v "$PWD/output/desktop-image:/output" \
            -v "$RUNNER_TEMP/kedra-r07-private/blueprint.toml:/config.toml:ro" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "$builder" --type qcow2 --rootfs ext4 --use-librepo=True localhost/kedra-desktop-test:r07 \
            > "$RUNNER_TEMP/kedra-r07-private/builder.log" 2>&1
      - name: Test graphical login and session under UEFI Secure Boot
        run: |
          set -euo pipefail
          uv run usr/src/kedra/tests/common/secure_boot.py provenance --evidence output/desktop-evidence
          mapfile -t disks < <(find "$PWD/output/desktop-image" -name '*.qcow2' -type f)
          test "${#disks[@]}" -eq 1
          # sudo resets PATH; hand root the pinned uv by absolute path.
          uv=$(command -v uv)
          sudo xvfb-run -a -s '-screen 0 1280x768x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            "$uv" run usr/src/kedra/tests/common/run_vm.py --disk "${disks[0]}" \
            --work "$PWD/output/desktop-evidence/vm" --password-file "$RUNNER_TEMP/kedra-r07-private/password" \
            | tee output/desktop-evidence/vm-result.txt
      - name: Sanitize builder evidence and remove disposable account secret
        if: always()
        run: |
          uv run python - <<'PY'
          import os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'kedra-r07-private'
          log = root / 'builder.log'
          if log.exists():
              text = re.sub(r'\$6\$[^\s"\x27]+', '<synthetic-password-hash-redacted>', log.read_text(errors='replace'))
              pathlib.Path('output/desktop-evidence/qcow2-build.log').write_text(text)
          for name in ['password', 'blueprint.toml', 'builder.log']:
              (root / name).unlink(missing_ok=True)
          PY
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r07-desktop-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/desktop-evidence/*.txt
            output/desktop-evidence/*.json
            output/desktop-evidence/*.log
            output/desktop-evidence/vm/*.png
            output/desktop-evidence/vm/*.log
          if-no-files-found: error
          retention-days: 14
