name: Test direct signed GHCR updates
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths:
      - .github/workflows/test-ghcr-update.yml
      - .github/workflows/release.yml
      - tests/vm/ghcr/**
      - tests/vm/console.toml
      - tests/resolve-fedora-base.py
      - build/inputs.json
      - build/release/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
permissions:
  contents: read
concurrency:
  group: test-ghcr-update-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'Reidond/kedra' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Prepare disposable native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman skopeo qemu-system-x86 qemu-utils ovmf openssl jq e2fsprogs
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --test 'e2e_*' --locked
          cargo build --workspace --release --locked
      - name: Exercise actual direct-registry signed A/B/rollback and refusals
        run: bash tests/vm/ghcr/run.sh
      - name: Retain public native outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghcr-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ghcr-evidence/
          if-no-files-found: error
          retention-days: 14
