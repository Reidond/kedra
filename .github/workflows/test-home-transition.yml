name: Test signed home transition
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/test-home-transition.yml
      - etc/**
      - usr/**
      - '!usr/src/kedra/**'
      - usr/src/kedra/image/Containerfile
      - usr/src/kedra/image/assemble.sh
      - usr/src/kedra/image/inputs.json
      - usr/src/kedra/image/packages.list
      - usr/src/kedra/image/remove.list
      - usr/src/kedra/image/agents/**
      - usr/src/kedra/image/bitwarden/**
      - usr/src/kedra/image/release/material.py
      - usr/src/kedra/image/release/targets.json
      - usr/src/kedra/image/release/compatibility.json
      - usr/src/kedra/image/targets/desktop/**
      - usr/src/kedra/tests/vm/home-transition/**
      - usr/src/kedra/tests/common/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - usr/src/kedra/crates/**
permissions:
  contents: read
concurrency:
  group: test-home-transition-${{ github.ref }}
  cancel-in-progress: false
jobs:
  home-artifact:
    if: github.repository == 'Reidond/kedra' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.19
          enable-cache: false
      - name: Prepare native public artifact tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          rustup toolchain install 1.98.1 --profile minimal
          cargo build --release --locked -p sysroot
      - name: Select the existing OCI-root Docker backend
        timeout-minutes: 2
        run: |
          set -euo pipefail
          test -z "$(docker ps --all --quiet)"
          test ! -L /etc/docker/daemon.json
          config=$(mktemp -d "$RUNNER_TEMP/kedra-docker-config.XXXXXXXX")
          trap 'rm -rf -- "$config"' EXIT
          if sudo test -e /etc/docker/daemon.json; then
            sudo test -f /etc/docker/daemon.json
            sudo cat /etc/docker/daemon.json > "$config/original.json"
          else
            printf '{}\n' > "$config/original.json"
          fi
          jq --exit-status 'type == "object" and ((.features // {}) | type == "object")' "$config/original.json" >/dev/null
          jq '.features = ((.features // {}) + {"containerd-snapshotter": true})' "$config/original.json" > "$config/daemon.json"
          sudo dockerd --validate --config-file "$config/daemon.json" > "$config/validate.log" 2>&1
          sudo install -m 0600 -o root -g root "$config/daemon.json" /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}' | jq --exit-status 'any(.[]; . == ["driver-type", "io.containerd.snapshotter.v1"])' >/dev/null
      - name: Compose the exact public B baseline
        # Engine retention requires complete OCI descriptors, not classic-only archives.
        run: |
          mkdir -p output
          base=$(uv run usr/src/kedra/tests/common/resolve-fedora-base.py --architecture arm64 --output output/artifact-base.json)
          uv run usr/src/kedra/tests/vm/home-transition/compose-artifact.py --foundation "$base" --output output/home-artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: composed-home-artifact-${{ github.sha }}
          path: output/home-artifact/
          if-no-files-found: error
          retention-days: 14
  native-home:
    if: github.repository == 'Reidond/kedra' && github.event_name != 'pull_request'
    needs: home-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.19
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: composed-home-artifact-${{ github.sha }}
          path: output/home-artifact
      - name: Prepare disposable runner tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman skopeo qemu-system-x86 qemu-system-gui qemu-utils ovmf python3-virt-firmware xvfb xauth mesa-utils imagemagick xdotool rpm cpio e2fsprogs
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --test 'e2e_*' --locked
          cargo build --workspace --release --locked
      - name: Exercise actual signed A and B graphical boots with writable home
        run: bash usr/src/kedra/tests/vm/home-transition/run.sh
      - name: Remove disposable private inputs
        if: always()
        run: |
          uv run python - <<'PY'
          import os, pathlib, shutil
          private = pathlib.Path(os.environ['RUNNER_TEMP']).resolve() / 'kedra-r04-private'
          if private.is_dir():
              shutil.rmtree(private)
          PY
      - name: Preserve public evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r04-native-transition-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/r04-evidence/
          if-no-files-found: error
          retention-days: 14
