name: Test QEMU ARM64 boot
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/test-qemu-arm64.yml
      - etc/**
      - usr/**
      - '!usr/src/kedra/**'
      - usr/src/kedra/image/Containerfile
      - usr/src/kedra/image/assemble.sh
      - usr/src/kedra/image/inputs.json
      - usr/src/kedra/image/packages.list
      - usr/src/kedra/image/remove.list
      - usr/src/kedra/image/agents/**
      - usr/src/kedra/image/bitwarden/**
      - usr/src/kedra/image/release/material.py
      - usr/src/kedra/image/release/compose.py
      - usr/src/kedra/image/release/native-steps.json
      - usr/src/kedra/tests/container/**
      - usr/src/kedra/tests/vm/ghcr-update/candidate.py
      - usr/src/kedra/image/release/targets.json
      - usr/src/kedra/image/release/compatibility.json
      - usr/src/kedra/image/targets/qemu-arm64/**
      - usr/src/kedra/tests/vm/qemu-arm64/**
      - usr/src/kedra/tests/common/resolve-fedora-base.py
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - usr/src/kedra/crates/**
permissions:
  contents: read
concurrency:
  group: test-qemu-arm64-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qemu-arm64:
    if: github.repository == 'Reidond/kedra' && github.event_name != 'pull_request'
    # Native aarch64 image build; hosted arm64 runners expose no /dev/kvm, so the
    # Secure Boot boot below is TCG emulation with generous bounds.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.19
          enable-cache: false
      - name: Build checked Rust tooling
        run: |
          test "$(uname -m)" = aarch64
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --test 'e2e_*' --locked
          cargo build --workspace --release --locked
      - name: Prepare explicit committed payload
        run: |
          mkdir -p output/qemu-arm64-evidence output/qemu-arm64-context
          target/release/sysroot source plan --host qemu-arm64 --json > output/qemu-arm64-evidence/source.json
          jq -e '.target.id == "qemu-arm64" and .target.architecture == "aarch64" and .target.candidate_target' \
            output/qemu-arm64-evidence/source.json > /dev/null
          target/release/sysroot source archive --host qemu-arm64 --output output/qemu-arm64-context/payload.tar
          cp target/release/sysroot target/release/sysroot-helper usr/src/kedra/image/Containerfile usr/src/kedra/image/assemble.sh output/qemu-arm64-context/
          cp usr/src/kedra/image/inputs.json output/qemu-arm64-evidence/
          bash usr/src/kedra/image/agents/prepare.sh qemu-arm64 output/qemu-arm64-context "$RUNNER_TEMP/kedra-agent-inputs" output/qemu-arm64-evidence/agent-inputs.json
          sha256sum output/qemu-arm64-context/* > output/qemu-arm64-evidence/build-input-hashes.txt
      - name: Install runner container and firmware tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman skopeo jq qemu-system-arm qemu-efi-aarch64 qemu-utils python3-virt-firmware
          uv run usr/src/kedra/image/bitwarden/prepare.py --target qemu-arm64 --context output/qemu-arm64-context --evidence output/qemu-arm64-evidence/bitwarden-inputs.json
          sha256sum output/qemu-arm64-context/* > output/qemu-arm64-evidence/build-input-hashes.txt
      - name: Build and validate Fedora qemu-arm64 candidate
        run: |
          set -euo pipefail
          base=$(uv run usr/src/kedra/tests/common/resolve-fedora-base.py --architecture arm64 --output output/qemu-arm64-evidence/base-resolution.json)
          {
            date --utc --iso-8601=seconds
            uname -a
            nproc
            free -h
            df -h
            podman --version
            skopeo --version
          } > output/qemu-arm64-evidence/environment.txt
          uv run usr/src/kedra/tests/vm/ghcr-update/candidate.py \
            --diagnostic-directory output/qemu-arm64-evidence \
            --context output/qemu-arm64-context --source-plan output/qemu-arm64-evidence/source.json \
            --base-image "$base" --work "$RUNNER_TEMP/kedra-arm-candidate" \
            --tag localhost/kedra-qemu-arm64:research \
            > output/qemu-arm64-evidence/composed-candidate.json
          sudo podman run --rm --network=none localhost/kedra-qemu-arm64:research bootc container lint \
            > output/qemu-arm64-evidence/final-lint.log
          sudo podman image inspect localhost/kedra-qemu-arm64:research > output/qemu-arm64-evidence/image-inspect.json
          jq -e '.[0].Os == "linux" and .[0].Architecture == "arm64"' output/qemu-arm64-evidence/image-inspect.json > /dev/null
          sudo podman run --rm localhost/kedra-qemu-arm64:research cat /usr/share/sysroot/packages.txt > output/qemu-arm64-evidence/packages.txt
          sudo podman run --rm localhost/kedra-qemu-arm64:research find /var -type f > output/qemu-arm64-evidence/image-var-files.txt
          # Image contents (guest agent RPC block list, graphics defaults,
          # kargs, Bitwarden, Codex, boot-chain packages) are container
          # scenarios in test-container.yml; the boot below needs this contract.
          contract=$(jq -er .bootc_version usr/src/kedra/image/release/compatibility.json)
          test "$(sudo podman run --rm localhost/kedra-qemu-arm64:research rpm -q --qf '%{VERSION} %{ARCH}' bootc)" = "$contract aarch64"
      - name: Prepare disposable Secure Boot observer fixture
        run: |
          mkdir -p output/qemu-arm64-test-context output/qemu-arm64-image output/qemu-arm64-evidence/vm
          cp usr/src/kedra/tests/vm/qemu-arm64/Containerfile usr/src/kedra/tests/vm/qemu-arm64/check.sh usr/src/kedra/tests/vm/qemu-arm64/check.service output/qemu-arm64-test-context/
          sudo podman build --pull=never --tag localhost/kedra-qemu-arm64-test:secureboot output/qemu-arm64-test-context \
            > output/qemu-arm64-evidence/test-image-build.log 2>&1
          uv run python - <<'PY'
          import json, os, pathlib, secrets, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'kedra-qemu-arm64-private'
          root.mkdir(mode=0o700)
          # Headless run: the account only lets the observer run doctor as a
          # non-root user, so the generated password is never written down.
          password = secrets.token_hex(16)
          hashed = subprocess.check_output(['openssl', 'passwd', '-6', '-stdin'], input=password.encode()).decode().strip()
          (root / 'blueprint.toml').write_text('[[customizations.user]]\nname = "kedra-test"\npassword = ' + json.dumps(hashed) + '\ngroups = ["wheel"]\n')
          (root / 'blueprint.toml').chmod(0o600)
          PY
      - name: Build disposable qemu-arm64 disk
        run: |
          set -euo pipefail
          builder=$(jq -er .platforms.arm64.builder usr/src/kedra/image/inputs.json)
          sudo podman pull "$builder" > output/qemu-arm64-evidence/builder-pull.log 2>&1
          test "$(sudo podman image inspect "$builder" --format '{{.Os}}/{{.Architecture}}')" = linux/arm64
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            -v "$PWD/output/qemu-arm64-image:/output" \
            -v "$RUNNER_TEMP/kedra-qemu-arm64-private/blueprint.toml:/config.toml:ro" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "$builder" --type qcow2 --rootfs ext4 --use-librepo=True localhost/kedra-qemu-arm64-test:secureboot \
            > "$RUNNER_TEMP/kedra-qemu-arm64-private/builder.log" 2>&1
          # The emulator needs no privilege: hand only the generated disk to the runner user.
          sudo chown -R "$(id -u):$(id -g)" output/qemu-arm64-image
          df -h > output/qemu-arm64-evidence/disk-space.txt
      - name: Boot through UEFI Secure Boot under TCG
        timeout-minutes: 100
        run: |
          set -euo pipefail
          mapfile -t disks < <(find "$PWD/output/qemu-arm64-image" -name '*.qcow2' -type f)
          test "${#disks[@]}" -eq 1
          digest=$(sudo podman image inspect localhost/kedra-qemu-arm64-test:secureboot --format '{{.Digest}}')
          bash usr/src/kedra/tests/vm/qemu-arm64/boot.sh "${disks[0]}" "$RUNNER_TEMP/kedra-qemu-arm64-vm" output/qemu-arm64-evidence/vm "$digest" \
            | tee output/qemu-arm64-evidence/vm-result.txt
      - name: Sanitize builder evidence and remove disposable account secret
        if: always()
        run: |
          uv run python - <<'PY'
          import os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'kedra-qemu-arm64-private'
          log = root / 'builder.log'
          if log.exists():
              text = re.sub(r'\$6\$[^\s"\x27]+', '<synthetic-password-hash-redacted>', log.read_text(errors='replace'))
              pathlib.Path('output/qemu-arm64-evidence/qcow2-build.log').write_text(text)
          for name in ['blueprint.toml', 'builder.log']:
              (root / name).unlink(missing_ok=True)
          PY
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-arm64-secureboot-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/qemu-arm64-evidence/*.txt
            output/qemu-arm64-evidence/*.json
            output/qemu-arm64-evidence/*.log
            output/qemu-arm64-evidence/vm/*.txt
            output/qemu-arm64-evidence/vm/*.log
          if-no-files-found: error
          retention-days: 14
