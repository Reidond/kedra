name: Test signed updates
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/test-signed-update.yml
      - usr/src/kedra/tests/vm/signed-update/**
      - usr/src/kedra/tests/common/**
      - usr/src/kedra/image/inputs.json
      - usr/src/kedra/image/agents/inputs.json
      - usr/src/kedra/image/release/compatibility.json
      - usr/src/kedra/image/release/targets.json
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - usr/src/kedra/crates/**
permissions:
  contents: read
concurrency:
  group: test-signed-update-${{ github.ref }}
  cancel-in-progress: false
jobs:
  signed-vm:
    if: github.repository == 'Reidond/kedra' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install disposable runner tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman skopeo qemu-system-x86 qemu-utils ovmf python3-virt-firmware openssl jq e2fsprogs
      - name: Test temporary keys, local TLS registry and three VM boots
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          cargo test --workspace --test 'e2e_*' --locked
          cargo build --workspace --release --locked
          bash usr/src/kedra/tests/vm/signed-update/run.sh
      - name: Preserve public research evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r01-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/r01-evidence/
          if-no-files-found: error
          retention-days: 14
