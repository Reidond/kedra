[workspace]
members = ["crates/sysroot", "crates/sysroot-core", "crates/sysroot-helper"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
sysroot-core = { path = "crates/sysroot-core" }
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tar = { version = "0.4.46", default-features = false }
toml = { version = "1.1.5", default-features = false, features = ["parse", "serde", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = "debuginfo"
