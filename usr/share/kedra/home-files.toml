# Home files that `sysroot home` manages for every account.
#
# These are the only home files it reads or writes. `path` is relative to the
# account's home and to the image baseline in /usr/share/sysroot/home/default.
# `check` validates a candidate before it replaces the live file; `{file}`
# becomes that candidate's path, which sits in the live file's directory so
# relative includes resolve. `sysroot doctor` runs the same check on the live
# file. `reload` runs once after the files that name it changed. Both are argv
# with an absolute program, never shell text.
schema_version = 1

# niri reloads its configuration itself when the file changes.
[[file]]
path = ".config/niri/config.kdl"
check = ["/usr/bin/niri", "validate", "--config", "{file}"]

# Noctalia reads every *.toml in its directory at start, so a candidate named
# without that extension is never loaded by the running shell.
[[file]]
path = ".config/noctalia/config.toml"
check = ["/usr/bin/noctalia", "config", "validate", "{file}"]
reload = ["/usr/bin/systemctl", "--user", "try-restart", "kedra-noctalia.service"]

[[file]]
path = ".config/noctalia/palettes/Adwaita.json"
reload = ["/usr/bin/systemctl", "--user", "try-restart", "kedra-noctalia.service"]
