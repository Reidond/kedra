# UTM always attaches org.qemu.guest_agent.0, and Fedora 44's /etc/sysconfig/qemu-ga
# blocks no RPC (QEMU_GA_ARGS is commented out). Refuse the RPCs that give whoever
# scripts UTM on the Mac root in the guest: command execution, file access,
# password and SSH authorized-key changes. UTM's own guest-sync-delimited,
# guest-set-time and guest-network-get-interfaces stay available; utmctl exec and
# utmctl file push/pull are refused. qemu-ga applies blocks after any --allow-rpcs
# in QEMU_GA_ARGS, which is still appended. ExecStart is re-declared rather than
# set through Environment=, which the unit's EnvironmentFile= would override. The
# command line is Fedora 44 qemu-guest-agent 10.2.2's plus --block-rpcs.
[Service]
ExecStart=
ExecStart=/usr/bin/qemu-ga \
  --method=virtio-serial \
  --path=/dev/virtio-ports/org.qemu.guest_agent.0 \
  -F${FSFREEZE_HOOK_PATHNAME} \
  --block-rpcs=guest-exec,guest-exec-status,guest-file-close,guest-file-flush,guest-file-open,guest-file-read,guest-file-seek,guest-file-write,guest-set-user-password,guest-ssh-add-authorized-keys,guest-ssh-get-authorized-keys,guest-ssh-remove-authorized-keys \
  $QEMU_GA_ARGS
