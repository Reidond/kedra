# Lab-only: the container has no DRM device, so niri runs as a window of the
# lab parent compositor. `niri --session` normally drops WAYLAND_DISPLAY to
# force its TTY backend; niri 26.04 keeps it when WSL_DISTRO_NAME is set
# (src/main.rs), which is the upstream nested-session path. Everything else
# about the session (environment import, graphical-session.target, spawn and
# portals) is the packaged niri.service.
[Unit]
Requires=kedra-lab-host.service
After=kedra-lab-host.service

[Service]
Environment=WAYLAND_DISPLAY=wayland-host WSL_DISTRO_NAME=kedra-lab LIBGL_ALWAYS_SOFTWARE=1
