version: 1
name: desktop_image
description: >
  Target identity of the x86_64 desktop image and the boot-chain packages that
  the VM workflows boot under Secure Boot.
profile: system
targets: [desktop]
steps:
  - exec:
      argv: [uname, -m]
      expect: {stdout: x86_64}
  - exec:
      argv: [jq, -c, .target, /usr/share/sysroot/source.json]
      expect:
        json:
          - select: $
            subset: {id: desktop, architecture: x86_64, image: ghcr.io/reidond/kedra-desktop}
  - exec:
      name: the bundled Codex is the x86_64 musl build
      argv: [jq, -er, .outputs.codex, /usr/share/kedra/catalog.json]
      capture:
        codex: {stdout: trim}
  - exec:
      argv: [jq, -r, .target, "/usr/lib/sysroot/store/${codex}/codex-package.json"]
      expect: {stdout: x86_64-unknown-linux-musl}
  - exec:
      name: Bitwarden is the x64 build
      argv: [jq, -er, .outputs.bitwarden, /usr/share/kedra/catalog.json]
      capture:
        bitwarden: {stdout: trim}
  - exec:
      argv: [test, -f, "/usr/lib/sysroot/store/${bitwarden}/resources/app.asar.unpacked/node_modules/@bitwarden/desktop-napi/desktop_napi.linux-x64-gnu.node"]
  - exec:
      argv: [rpm, -q, shim-x64, grub2-efi-x64, bootupd, mokutil, efibootmgr, kernel-core, bootc]
