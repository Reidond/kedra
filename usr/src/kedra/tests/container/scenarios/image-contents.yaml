version: 1
name: image_contents
description: >
  Installed-image checks that need no session: packaged desktop programs,
  validated account defaults, enabled/masked units, toolkit integration
  packages, the Bitwarden and private Codex catalog packages. Formerly the host-side
  podman checks of test-desktop.yml and part of qemu-arm64-image/image-check.sh.
profile: system
steps:
  - exec:
      name: niri and Noctalia run
      argv: [niri, --version]
      expect: {stdout_contains: ["niri "]}
  - exec:
      argv: [noctalia, --version]
      expect: {stdout_contains: ["noctalia v"]}
  - exec:
      argv: [noctalia, msg, --help]
  - exec:
      name: the shipped niri defaults validate with the installed niri
      argv: [niri, validate, --config, /usr/share/sysroot/home/default/.config/niri/config.kdl]
  - exec:
      name: the shipped Noctalia defaults validate with the installed Noctalia
      argv: [noctalia, config, validate]
      env:
        NOCTALIA_CONFIG_HOME: /usr/share/sysroot/home/default/.config
        NOCTALIA_STATE_HOME: /tmp/kedra-noctalia-validation
  - exec:
      name: new accounts receive the shipped defaults
      argv: [cmp, /usr/share/sysroot/home/default/.config/niri/config.kdl, /etc/skel/.config/niri/config.kdl]
  - exec:
      name: greetd PAM stack includes GNOME Keyring
      argv: [cat, /etc/pam.d/greetd]
      expect: {stdout_contains: [pam_gnome_keyring.so]}
  - exec:
      name: greetd is the enabled login manager
      argv: [systemctl, is-enabled, greetd.service]
      expect: {stdout: enabled}
  - exec:
      name: automatic bootc updates stay masked (sysroot owns updates)
      argv: [systemctl, is-enabled, bootc-fetch-apply-updates.timer]
      expect: {exit: 1, stdout: masked}
  - exec:
      argv: [systemctl, get-default]
      expect: {stdout: graphical.target}
  - exec:
      name: the resolved package inventory is recorded
      argv: [test, -s, /usr/share/sysroot/packages.txt]
  - exec:
      name: native toolkit integration packages are installed
      argv: [rpm, -q, gtk3, adw-gtk3-theme, gtk4, libadwaita, qt5-qtbase-gui, qt6-qtbase-gui, plasma-integration,
             plasma-integration-qt5, plasma-breeze, plasma-breeze-qt5, breeze-icon-theme]
  - exec:
      argv: [test, -r, /usr/share/themes/adw-gtk3/gtk-3.0/gtk.css]
  - exec:
      name: xwaylandvideobridge does not autostart under niri
      argv: [grep, -Fx, "NotShowIn=niri;", /etc/xdg/autostart/org.kde.xwaylandvideobridge.desktop]
  - exec:
      name: Bitwarden is the unchanged official tree, a catalog package output
      argv: [jq, -er, .outputs.bitwarden, /usr/share/kedra/catalog.json]
      capture:
        bitwarden: {stdout: trim}
  - exec:
      argv: [test, -x, "/usr/lib/sysroot/store/${bitwarden}/bitwarden-app"]
  - exec:
      name: nothing in the Bitwarden tree has special permission bits or is a special file
      argv: [find, "/usr/lib/sysroot/store/${bitwarden}", -perm, /7000, -print, -quit]
      expect: {stdout: ""}
  - exec:
      argv: [find, "/usr/lib/sysroot/store/${bitwarden}", "!", -type, f, "!", -type, d, -print, -quit]
      expect: {stdout: ""}
  - exec:
      name: the desktop entry starts the exact package output and names its icon
      argv: [grep, -Fx, "Exec=/usr/lib/sysroot/store/${bitwarden}/bitwarden %u", /usr/share/applications/com.bitwarden.desktop.desktop]
  - exec:
      argv: [grep, -Fx, "Icon=/usr/lib/sysroot/store/${bitwarden}/resources/icons/256x256.png", /usr/share/applications/com.bitwarden.desktop.desktop]
  - exec:
      argv: [test, -f, "/usr/lib/sysroot/store/${bitwarden}/resources/icons/256x256.png"]
  - exec:
      name: locate the architecture's Bitwarden native module
      argv: [find, "/usr/lib/sysroot/store/${bitwarden}/resources/app.asar.unpacked/node_modules/@bitwarden/desktop-napi", -name, "desktop_napi.linux-*.node"]
      expect: {stdout_nonempty: true}
      capture:
        napi: {stdout: trim}
  - exec:
      name: Bitwarden has every shared library
      argv: [ldd, "/usr/lib/sysroot/store/${bitwarden}/bitwarden-app", "/usr/lib/sysroot/store/${bitwarden}/desktop_proxy", "${napi}"]
      expect: {stdout_lacks: [not found]}
  - exec:
      name: the corresponding Bitwarden client source and license terms ship with the image
      argv: [jq, -er, .outputs.bitwarden_licenses, /usr/share/kedra/catalog.json]
      capture:
        bitwarden_licenses: {stdout: trim}
  - exec:
      argv: [test, -s, "/usr/lib/sysroot/store/${bitwarden_licenses}/share/licenses/bitwarden/clients-source.tar.gz"]
  - exec:
      argv: [test, -s, "/usr/lib/sysroot/store/${bitwarden_licenses}/share/licenses/bitwarden/LICENSE_GPL.txt"]
  - exec:
      name: the bundled Codex runs through its private launcher and reports its pinned version
      argv: [jq, -er, .versions.codex, /usr/share/kedra/catalog.json]
      capture:
        codex_version: {stdout: trim}
  - exec:
      argv: [/usr/share/kedra/catalog-libexec/codex, --version]
      env: {HOME: /tmp}
      expect: {stdout: "codex-cli ${codex_version}"}
  - exec:
      name: Codex notices and corresponding source ship with the image
      argv: [jq, -er, .outputs.codex_licenses, /usr/share/kedra/catalog.json]
      capture:
        codex_licenses: {stdout: trim}
  - exec:
      argv: [test, -s, "/usr/lib/sysroot/store/${codex_licenses}/share/licenses/codex/corresponding-source.tar.gz"]
  - exec:
      argv: [jq, -er, .outputs.codex_components, /usr/share/kedra/catalog.json]
      capture:
        codex_components: {stdout: trim}
  - exec:
      argv: [test, -s, "/usr/lib/sysroot/store/${codex_components}/share/licenses/codex-components/zsh-LICENCE"]
  - exec:
      name: the installed sysroot runs and reports its version
      argv: [sysroot, --version]
      expect: {stdout_nonempty: true}
