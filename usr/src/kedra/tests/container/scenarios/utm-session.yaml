version: 1
name: utm_session_graphics
description: The utm target keeps GTK 4 on the GL renderer in the real session (UTM 5.0.6 Venus limits).
profile: desktop
targets: [utm]
steps:
  - exec:
      as: user
      argv: [systemctl, --user, show-environment]
      expect: {stdout_contains: ["GSK_RENDERER=gl\n"]}
